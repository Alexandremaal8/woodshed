<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Woodshed">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Woodshed</title>
<style>:root {
  --bg: #120f0d;
  --bg2: #1b1714;
  --card: #221d19;
  --card2: #2b2520;
  --line: #3a322b;
  --text: #f4ede4;
  --muted: #a89a8b;
  --accent: #f2a541;
  --accent2: #ffcf7a;
  --good: #4fc18f;
  --bad: #ef5d5d;
  --blue: #6cb4ee;
  --radius: 16px;
  --tabh: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 16px; -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
body { min-height: 100vh; min-height: 100dvh; }
button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; width: 100%; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
h1 { font-size: 28px; font-weight: 800; }
h2 { font-size: 21px; font-weight: 750; }
h3 { font-size: 17px; font-weight: 700; }
p { line-height: 1.5; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 700; color: var(--muted); }

#app { padding: calc(var(--safe-t) + 14px) 16px calc(var(--tabh) + var(--safe-b) + 24px); max-width: 640px; margin: 0 auto; }
#app.fullscreen { padding-bottom: calc(var(--safe-b) + 24px); }

.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 14px; }
.center { text-align: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card.tap { cursor: pointer; transition: transform .12s ease, background .12s; }
.card.tap:active { transform: scale(.985); background: var(--card2); }
.card.hero { background: linear-gradient(150deg, #3a2a17 0%, #261d15 55%, #1f1915 100%); border-color: #5a4126; }
.card.dim { opacity: .55; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 18px; border-radius: 14px; font-weight: 700; background: var(--card2); border: 1px solid var(--line); min-height: 48px; transition: transform .1s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #241505; border-color: var(--accent); }
.btn.good { background: var(--good); color: #062517; border-color: var(--good); }
.btn.danger { background: transparent; color: var(--bad); border-color: #5a2a2a; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 18px; border-radius: 18px; }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--card2); border: 1px solid var(--line); font-size: 18px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 9px 14px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-weight: 650; font-size: 14px; }
.chip.on { background: var(--accent); color: #241505; border-color: var(--accent); }
.chip.locked { opacity: .5; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabh) + var(--safe-b)); padding-bottom: var(--safe-b); background: rgba(18,15,13,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); display: flex; z-index: 20; }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 650; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.on { color: var(--accent); }

.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 10px; }
.levelchip { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; font-weight: 700; font-size: 14px; }
.levelchip .lv { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #241505; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }

.bar { height: 8px; background: var(--bg2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .4s; }
.bar.good > i { background: var(--good); }

.weekdots { display: flex; gap: 8px; }
.weekdots i { width: 28px; height: 28px; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 14px; }
.weekdots i.on { background: var(--good); border: 2px solid var(--good); color: #062517; }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
.badge.accent { color: var(--accent); border-color: #5a4126; }
.badge.good { color: var(--good); border-color: #23543d; }

.fbwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 4px 16px; scrollbar-width: none; }
.fbwrap::-webkit-scrollbar { display: none; }
svg.fb { display: block; touch-action: manipulation; }
svg.fb .cell { fill: transparent; cursor: pointer; }
svg.fb .mark circle { stroke-width: 2; }
svg.fb text { font-family: inherit; pointer-events: none; }

.option { width: 100%; text-align: left; padding: 15px 16px; border-radius: 14px; background: var(--card2); border: 1.5px solid var(--line); font-weight: 600; font-size: 16px; }
.option.right { border-color: var(--good); background: rgba(79,193,143,.14); }
.option.wrong { border-color: var(--bad); background: rgba(239,93,93,.12); }
.feedback { border-radius: 14px; padding: 14px; }
.feedback.ok { background: rgba(79,193,143,.12); border: 1px solid #23543d; }
.feedback.no { background: rgba(239,93,93,.1); border: 1px solid #5a2a2a; }

.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 20px; border-radius: 99px; }

.lessoncard { min-height: 220px; display: flex; flex-direction: column; gap: 12px; }
.lessoncard p b { color: var(--accent2); }

.blockhead { display: flex; gap: 6px; }
.blockhead i { flex: 1; height: 5px; border-radius: 9px; background: var(--line); }
.blockhead i.on { background: var(--accent); }
.blockhead i.done { background: var(--good); }

.timer { font-variant-numeric: tabular-nums; font-weight: 800; }
.chordbig { font-size: 54px; font-weight: 850; letter-spacing: -0.03em; line-height: 1; }
.recdot { width: 12px; height: 12px; border-radius: 50%; background: var(--bad); display: inline-block; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.meter { height: 10px; background: var(--bg2); border-radius: 9px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--accent) 75%, var(--bad)); transition: width .06s; }
.recbtn { width: 84px; height: 84px; border-radius: 50%; background: var(--bad); border: 5px solid #4a2020; box-shadow: 0 0 0 3px var(--bad); display: flex; align-items: center; justify-content: center; }
.recbtn.on { border-radius: 26px; }
.recbtn span { width: 30px; height: 30px; border-radius: 50%; background: #fff; }
.recbtn.on span { border-radius: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + var(--safe-b) + 14px); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--card2); border: 1px solid var(--accent); color: var(--text); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 100; transition: all .25s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; animation: fadein .15s; }
.modal { background: var(--bg2); border: 1px solid var(--line); border-radius: 22px 22px 0 0; padding: 20px 18px calc(var(--safe-b) + 20px); width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; animation: slideup .2s ease; }
.modal.centered { border-radius: 22px; margin: auto 16px; }
@keyframes fadein { from { opacity: 0; } }
@keyframes slideup { from { transform: translateY(40px); opacity: .5; } }
.celebrate { text-align: center; padding: 10px 0 4px; }
.celebrate .big { font-size: 64px; }

.list > * + * { margin-top: 10px; }
.rec .play { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #241505; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rec .play svg { width: 20px; height: 20px; }
.rec.sel { border-color: var(--blue); }
.seek { height: 6px; background: var(--bg2); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.seek i { display: block; height: 100%; width: 0; background: var(--accent); }

.ring { position: relative; width: 120px; height: 120px; }
.ring svg { transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-weight: 800; }

.toggle { position: relative; width: 50px; height: 30px; border-radius: 99px; background: var(--line); flex-shrink: 0; transition: background .2s; }
.toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle.on { background: var(--good); }
.toggle.on::after { transform: translateX(20px); }

.chapter .num { width: 44px; height: 44px; border-radius: 12px; background: var(--card2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.lessonrow { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.lessonrow:last-child { border-bottom: none; }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.check.on { background: var(--good); border-color: var(--good); color: #062517; }
.slider { -webkit-appearance: none; appearance: none; height: 6px; padding: 0; border: none; background: var(--line); border-radius: 9px; }
.slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: none; }
.beat { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: background .05s; }
.beat.on { background: var(--accent); }
.help p + p { margin-top: 8px; }
.hr { height: 1px; background: var(--line); margin: 6px 0; }

/* ===================== Bubble theme ===================== */
:root { --radius: 26px; }
body { background:
  radial-gradient(120% 60% at 50% -10%, rgba(242,165,65,.16) 0%, rgba(242,165,65,0) 60%),
  radial-gradient(80% 50% at 100% 100%, rgba(108,180,238,.06) 0%, rgba(0,0,0,0) 60%),
  var(--bg); background-attachment: fixed; }

/* cards: soft, layered */
.card { border-radius: var(--radius); background: linear-gradient(180deg, #27211c 0%, #1f1a16 100%); border: 1px solid rgba(255,255,255,.06);
  box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 10px 30px rgba(0,0,0,.35); }
.card.hero { background: radial-gradient(130% 120% at 0% 0%, #5a3a1a 0%, #33241a 45%, #211a15 100%); border: 1px solid rgba(242,165,65,.28);
  box-shadow: 0 1px 0 rgba(255,220,160,.12) inset, 0 16px 40px rgba(0,0,0,.45), 0 0 50px rgba(242,165,65,.08); }

/* bubble buttons */
.btn { border-radius: 999px; border: none; padding: 13px 22px;
  background: linear-gradient(180deg, #3b332c 0%, #2a241f 100%);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.12), inset 0 -2px 0 rgba(0,0,0,.25), 0 4px 12px rgba(0,0,0,.3);
  transition: transform .15s cubic-bezier(.3,1.6,.5,1), box-shadow .15s; }
.btn:active { transform: scale(.94); box-shadow: inset 0 2px 6px rgba(0,0,0,.35); }
.btn.primary { color: #2a1704; background: linear-gradient(180deg, #ffd48a 0%, #f6a83e 55%, #e88a22 100%);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(150,70,0,.35), 0 8px 22px rgba(242,150,50,.38); }
.btn.good { background: linear-gradient(180deg, #7ee0b1 0%, #3fb37f 100%); box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,80,40,.3), 0 8px 20px rgba(79,193,143,.3); }
.btn.danger { background: linear-gradient(180deg, #3a2222 0%, #2a1a1a 100%); color: #ff8a8a; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); }
.btn.big { min-height: 64px; font-size: 20px; letter-spacing: -0.01em; }
.btn.sm { border-radius: 999px; padding: 8px 14px; }
.iconbtn { border-radius: 50%; border: none; background: linear-gradient(180deg, #3b332c, #2a241f); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.3); }
.iconbtn:active { transform: scale(.92); }

/* chips = small bubbles */
.chip { border: none; padding: 10px 16px; background: linear-gradient(180deg, #3a322b, #2a241f);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.1), 0 3px 8px rgba(0,0,0,.25); transition: transform .15s cubic-bezier(.3,1.6,.5,1); }
.chip:active { transform: scale(.93); }
.chip.on { color: #2a1704; background: linear-gradient(180deg, #ffd48a, #f2a541); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 14px rgba(242,165,65,.35); }

/* answer options as bubbles */
.option { border-radius: 22px; border: 1.5px solid transparent; background: linear-gradient(180deg, #332c26, #28221d);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.08), 0 4px 12px rgba(0,0,0,.25); transition: transform .15s cubic-bezier(.3,1.6,.5,1); }
.option:active { transform: scale(.97); }
.option.right { border-color: var(--good); background: linear-gradient(180deg, rgba(79,193,143,.28), rgba(79,193,143,.12)); animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
.option.wrong { border-color: var(--bad); background: linear-gradient(180deg, rgba(239,93,93,.25), rgba(239,93,93,.1)); animation: shake .3s; }
@keyframes pop { 50% { transform: scale(1.04); } }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.feedback { border-radius: 20px; }

/* segmented bubble switch */
.seg { display: flex; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.35); box-shadow: inset 0 2px 6px rgba(0,0,0,.4); }
.seg button { flex: 1; padding: 10px 8px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); transition: all .2s; }
.seg button.on { color: #2a1704; background: linear-gradient(180deg, #ffd48a, #f2a541); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 3px 10px rgba(242,165,65,.35); }

/* quick tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px 12px; border-radius: 22px;
  background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02)); box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  transition: transform .15s cubic-bezier(.3,1.6,.5,1); }
.tile:active { transform: scale(.93); }
.tile b { font-size: 14px; }
.tile small { font-size: 11px; color: var(--muted); }
.bubble { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 25px;
  background: radial-gradient(circle at 35% 30%, #5a4430 0%, #2e241c 70%);
  box-shadow: inset 0 2px 3px rgba(255,255,255,.18), inset 0 -4px 8px rgba(0,0,0,.35), 0 5px 12px rgba(0,0,0,.35); }

/* tab bar: floating bubble */
.tabs { left: 12px; right: 12px; bottom: calc(var(--safe-b) + 10px); height: var(--tabh); padding-bottom: 0; border-radius: 999px;
  border: 1px solid rgba(255,255,255,.08); background: rgba(34,28,24,.82); box-shadow: 0 12px 30px rgba(0,0,0,.5); max-width: 616px; margin: 0 auto; }
.tabs button { border-radius: 999px; margin: 6px 2px; transition: all .2s; }
.tabs button.on { background: rgba(242,165,65,.14); }
#app { padding-bottom: calc(var(--tabh) + var(--safe-b) + 34px); }

/* misc polish */
.levelchip { border: none; background: linear-gradient(180deg, #3a322b, #2a241f); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.1), 0 4px 12px rgba(0,0,0,.3); }
.levelchip .lv { background: linear-gradient(180deg, #ffd48a, #f2a541); box-shadow: inset 0 2px 0 rgba(255,255,255,.5); }
.badge { border: none; background: rgba(255,255,255,.07); }
.badge.accent { background: rgba(242,165,65,.15); }
.badge.good { background: rgba(79,193,143,.15); }
.weekdots i { width: 32px; height: 32px; }
.weekdots i.on { background: radial-gradient(circle at 35% 30%, #8ae8bc, #3fb37f); border: none; box-shadow: 0 3px 10px rgba(79,193,143,.35); }
.bar { height: 10px; background: rgba(0,0,0,.35); box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
.stat { border-radius: 22px; border: none; background: linear-gradient(180deg, #27211c, #1f1a16); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 6px 16px rgba(0,0,0,.3); }
input, select { border-radius: 18px; background: rgba(0,0,0,.3); border: 1px solid rgba(255,255,255,.08); }
.chapter .num, .check { box-shadow: inset 0 1px 2px rgba(255,255,255,.1); }
.chapter .num { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #4a3a2c, #2a221c); }
.recbtn { background: radial-gradient(circle at 35% 30%, #ff8a8a, #e04848); box-shadow: 0 0 0 4px rgba(239,93,93,.35), 0 10px 26px rgba(239,93,93,.35); border: none; }
.modal { border-radius: 30px 30px 0 0; background: linear-gradient(180deg, #241e1a, #1a1613); }
.modal.centered { border-radius: 30px; }
.toast { border: none; background: linear-gradient(180deg, #3a322b, #2a241f); box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 1px rgba(242,165,65,.4); }
.lessoncard { min-height: 240px; }
.toggle { box-shadow: inset 0 2px 4px rgba(0,0,0,.35); }
.toggle::after { box-shadow: 0 2px 5px rgba(0,0,0,.35); }
.chordbox { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 8px 6px; border-radius: 22px; background: rgba(0,0,0,.25); cursor: pointer; }
.chordbox b { font-size: 18px; }
.chordrow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.howto { margin-top: 12px; text-align: center; }
.howto .tiny { margin-bottom: 8px; }
svg.fb .mark { pointer-events: none; }
svg.fb .ripple { pointer-events: none; animation: ripple .45s ease-out forwards; }
@keyframes ripple { from { opacity: .7; } to { opacity: 0; } }

/* ===================== Feel: ripples, springs, transitions ===================== */
.btn, .chip, .tile, .option, .card.tap, .tabs button, .iconbtn, .levelchip, .seg button, .lessonrow, .recbtn, .chordbox, .rec .play { position: relative; overflow: hidden; -webkit-user-select: none; user-select: none; }
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.35) 0%, rgba(255,255,255,.12) 40%, rgba(255,255,255,0) 70%); transform: scale(0); animation: rip .6s cubic-bezier(.2,.8,.2,1) forwards; }
.btn.primary .rip, .chip.on .rip, .seg button.on .rip { background: radial-gradient(circle, rgba(255,255,255,.6) 0%, rgba(255,255,255,.2) 40%, rgba(255,255,255,0) 70%); }
@keyframes rip { to { transform: scale(1); opacity: 0; } }

/* springy press for everything pressable */
.btn, .chip, .tile, .option, .card.tap, .iconbtn, .levelchip, .lessonrow, .chordbox, .rec .play { transition: transform .35s cubic-bezier(.34,1.8,.5,1), box-shadow .2s, background .2s; }
.btn:active, .chip:active, .tile:active, .iconbtn:active, .levelchip:active, .rec .play:active { transform: scale(.92); transition-duration: .08s; }
.card.tap:active, .option:active, .lessonrow:active, .chordbox:active { transform: scale(.97); transition-duration: .08s; }
.recbtn { transition: transform .35s cubic-bezier(.34,1.8,.5,1), border-radius .3s; }

<div id="app"></div>
<script>
// ---------- Music theory helpers ----------
const SHARPS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLATS  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb','D minor','G minor','C minor','F minor','Bb minor','Eb minor']);

// Standard tuning, low to high. index 0 = low E (6th string)
const STRINGS = [
  { label: 'E', midi: 40 },
  { label: 'A', midi: 45 },
  { label: 'D', midi: 50 },
  { label: 'G', midi: 55 },
  { label: 'B', midi: 59 },
  { label: 'e', midi: 64 },
];

const INTERVALS = [
  { semi: 0,  short: 'P1', name: 'Unison' },
  { semi: 1,  short: 'm2', name: 'Minor 2nd' },
  { semi: 2,  short: 'M2', name: 'Major 2nd' },
  { semi: 3,  short: 'm3', name: 'Minor 3rd' },
  { semi: 4,  short: 'M3', name: 'Major 3rd' },
  { semi: 5,  short: 'P4', name: 'Perfect 4th' },
  { semi: 6,  short: 'TT', name: 'Tritone' },
  { semi: 7,  short: 'P5', name: 'Perfect 5th' },
  { semi: 8,  short: 'm6', name: 'Minor 6th' },
  { semi: 9,  short: 'M6', name: 'Major 6th' },
  { semi: 10, short: 'm7', name: 'Minor 7th' },
  { semi: 11, short: 'M7', name: 'Major 7th' },
  { semi: 12, short: 'P8', name: 'Octave' },
];

const SCALES = {
  major:      { name: 'Major scale',       steps: [0,2,4,5,7,9,11], degrees: ['1','2','3','4','5','6','7'] },
  minor:      { name: 'Natural minor',     steps: [0,2,3,5,7,8,10], degrees: ['1','2','b3','4','5','b6','b7'] },
  minorPent:  { name: 'Minor pentatonic',  steps: [0,3,5,7,10],     degrees: ['1','b3','4','5','b7'] },
  majorPent:  { name: 'Major pentatonic',  steps: [0,2,4,7,9],      degrees: ['1','2','3','5','6'] },
  blues:      { name: 'Blues scale',       steps: [0,3,5,6,7,10],   degrees: ['1','b3','4','b5','5','b7'] },
  dorian:     { name: 'Dorian',            steps: [0,2,3,5,7,9,10], degrees: ['1','2','b3','4','5','6','b7'] },
  mixolydian: { name: 'Mixolydian',        steps: [0,2,4,5,7,9,10], degrees: ['1','2','3','4','5','6','b7'] },
};

const CHORD_TYPES = {
  maj:  { name: 'Major',      sym: '',     iv: [0,4,7] },
  min:  { name: 'Minor',      sym: 'm',    iv: [0,3,7] },
  dim:  { name: 'Diminished', sym: 'dim',  iv: [0,3,6] },
  dom7: { name: 'Dominant 7', sym: '7',    iv: [0,4,7,10] },
  maj7: { name: 'Major 7',    sym: 'maj7', iv: [0,4,7,11] },
  m7:   { name: 'Minor 7',    sym: 'm7',   iv: [0,3,7,10] },
};

const mod12 = n => ((n % 12) + 12) % 12;

function pcOf(name) {
  const n = String(name).trim().replace('♯', '#').replace('♭', 'b');
  const base = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 }[n[0].toUpperCase()];
  if (base === undefined) return -1;
  let acc = 0;
  for (const c of n.slice(1)) { if (c === '#') acc++; else if (c === 'b') acc--; else return -1; }
  return mod12(base + acc);
}

function noteName(pc, preferFlats = false) {
  return (preferFlats ? FLATS : SHARPS)[mod12(pc)];
}
function bothNames(pc) {
  const s = SHARPS[mod12(pc)], f = FLATS[mod12(pc)];
  return s === f ? s : `${s}/${f}`;
}
function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function fretPc(stringIdx, fret) { return mod12(STRINGS[stringIdx].midi + fret); }
function fretMidi(stringIdx, fret) { return STRINGS[stringIdx].midi + fret; }

function scalePcs(rootPc, scaleKey) {
  return SCALES[scaleKey].steps.map(s => mod12(rootPc + s));
}

// Chord voicing for playback (guitar-like spread)
function chordVoicing(rootPc, type) {
  let r = 40 + mod12(rootPc - 4); // root between E2 and D#3
  if (r < 43) r += 12;            // keep it from getting muddy
  const iv = CHORD_TYPES[type].iv;
  const third = iv[1], fifth = iv[2], seventh = iv[3];
  const notes = [r, r + fifth, r + 12, r + 12 + third];
  if (seventh !== undefined) notes.push(r + seventh + 12); else notes.push(r + 12 + fifth);
  return notes;
}

function chordName(rootPc, type, flats) {
  return noteName(rootPc, flats) + CHORD_TYPES[type].sym;
}

// Diatonic chords of a major key (triads)
const MAJOR_KEY_CHORDS = [
  { deg: 'I',    off: 0,  type: 'maj' },
  { deg: 'ii',   off: 2,  type: 'min' },
  { deg: 'iii',  off: 4,  type: 'min' },
  { deg: 'IV',   off: 5,  type: 'maj' },
  { deg: 'V',    off: 7,  type: 'maj' },
  { deg: 'vi',   off: 9,  type: 'min' },
  { deg: 'vii°', off: 11, type: 'dim' },
];

// Keys offered in the studio
const KEYS = ['E','A','D','G','C','F','Bb','B','F#','C#','Eb','Ab'];

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

// ---------- Chord shapes (for diagrams) ----------
// frets low E → high e, -1 = muted. fingers same order (0 = open / none)
const OPEN_SHAPES = {
  'C:maj':  { f: [-1,3,2,0,1,0], g: [0,3,2,0,1,0] },
  'D:maj':  { f: [-1,-1,0,2,3,2], g: [0,0,0,1,3,2] },
  'G:maj':  { f: [3,2,0,0,0,3], g: [2,1,0,0,0,3] },
  'D:min':  { f: [-1,-1,0,2,3,1], g: [0,0,0,2,3,1] },
  'D:dom7': { f: [-1,-1,0,2,1,2], g: [0,0,0,2,1,3] },
  'C:dom7': { f: [-1,3,2,3,1,0], g: [0,3,2,4,1,0] },
  'G:dom7': { f: [3,2,0,0,0,1], g: [3,2,0,0,0,1] },
  'B:dom7': { f: [-1,2,1,2,0,2], g: [0,2,1,3,0,4] },
  'C:maj7': { f: [-1,3,2,0,0,0], g: [0,3,2,0,0,0] },
  'D:maj7': { f: [-1,-1,0,2,2,2], g: [0,0,0,1,2,3] },
  'F:maj7': { f: [-1,-1,3,2,1,0], g: [0,0,3,2,1,0] },
  'D:m7':   { f: [-1,-1,0,2,1,1], g: [0,0,0,2,1,1] },
};
const BARRE_SHAPES = {
  E: { maj: [0,2,2,1,0,0], min: [0,2,2,0,0,0], dom7: [0,2,0,1,0,0], maj7: [0,2,1,1,0,0], m7: [0,2,0,0,0,0], dim: [0,1,2,0,-99,-99] },
  A: { maj: [-99,0,2,2,2,0], min: [-99,0,2,2,1,0], dom7: [-99,0,2,0,2,0], maj7: [-99,0,2,1,2,0], m7: [-99,0,2,0,1,0], dim: [-99,0,1,2,1,-99] },
};
function barreShape(kind, rootPc, type) {
  const r = kind === 'E' ? mod12(rootPc - 4) : mod12(rootPc - 9);
  const rel = BARRE_SHAPES[kind][type];
  const frets = rel.map(x => x <= -50 ? -1 : r + x);
  const fingers = frets.map(() => 0);
  if (r > 0) frets.forEach((f, i) => { if (f === r) fingers[i] = 1; });
  const rest = frets.map((f, i) => ({ f, i })).filter(o => o.f > r).sort((a, b) => a.f - b.f || a.i - b.i);
  let next = r > 0 ? 2 : 1;
  rest.forEach(o => { fingers[o.i] = Math.min(4, next++); });
  return { frets, fingers, barre: r > 0 ? r : 0, r, kind };
}
function chordShape(rootPc, type) {
  const open = OPEN_SHAPES[noteName(rootPc) + ':' + type];
  if (open) return { frets: open.f, fingers: open.g };
  const e = barreShape('E', rootPc, type), a = barreShape('A', rootPc, type);
  return e.r <= a.r ? e : a;
}
// Every useful way to play a chord: open shape (if any) + E-shape + A-shape
function chordShapesAll(rootPc, type) {
  const out = [];
  const open = OPEN_SHAPES[noteName(rootPc) + ':' + type];
  if (open) out.push({ frets: open.f, fingers: open.g, label: 'Open' });
  for (const k of ['E', 'A']) {
    const sh = barreShape(k, rootPc, type);
    sh.label = sh.r === 0 ? 'Open' : `${k}-shape barre · fret ${sh.r}`;
    if (!out.some(o => o.frets.join() === sh.frets.join())) out.push(sh);
  }
  return out;
}

// Real guitar notes of the chord shape (what the diagram shows)
function shapeMidis(rootPc, type) {
  return chordShape(rootPc, type).frets.map((f, i) => f >= 0 ? fretMidi(i, f) : null).filter(x => x !== null);
}
function parseChord(v) {
  const mm = String(v).trim().replace('♯', '#').replace('♭', 'b').match(/^([A-Ga-g])([#b]?)\s*(.*)$/);
  if (!mm) return null;
  const pc = pcOf(mm[1].toUpperCase() + mm[2]);
  const q = mm[3].trim();
  let type = null;
  if (q === '' || /^(maj|major)$/i.test(q) || q === 'M') type = 'maj';
  else if (q === 'm' || /^(min|minor|-)$/i.test(q)) type = 'min';
  else if (q === '7' || /^dom(inant)?\s*7$/i.test(q)) type = 'dom7';
  else if (/^(maj7|M7|major\s*7)$/.test(q)) type = 'maj7';
  else if (/^(m7|min7|minor\s*7)$/i.test(q)) type = 'm7';
  return type ? { pc, type } : null;
}
const EAR_CHORD_POOL = [[0,'maj'],[2,'maj'],[4,'maj'],[5,'maj'],[7,'maj'],[9,'maj'],[11,'maj'],[9,'min'],[4,'min'],[2,'min'],[11,'min']];

// Correct spelling: the note `semi` half steps above rootName, written with the letter `steps` letters above
const LETTERS = ['C','D','E','F','G','A','B'];
const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function spell(rootName, semi, steps) {
  const L = LETTERS[(LETTERS.indexOf(rootName[0]) + steps) % 7];
  const target = mod12(pcOf(rootName) + semi);
  let diff = mod12(target - LETTER_PC[L]); if (diff > 6) diff -= 12;
  if (Math.abs(diff) > 1) return noteName(target, /b/.test(rootName) || rootName === 'F');
  return L + (diff > 0 ? '#'.repeat(diff) : 'b'.repeat(-diff));
}
function degSteps(label) { const n = parseInt(String(label).replace(/[^0-9]/g, ''), 10); return (n - 1) % 7; }
function spelledChordTones(rootName, type) {
  const iv = CHORD_TYPES[type].iv, st = [0, 2, 4, 6];
  return iv.map((s, i) => spell(rootName, s, st[i]));
}

// ---------- Audio engine: guitar synth, drums, backing tracks, recorder ----------
const AudioEngine = (() => {
  let ctx = null, master, backingBus, sfxBus, noiseBuf;
  const ksCache = new Map();

  function setSession(type) {
    try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) {}
  }

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({ latencyHint: 'interactive' });
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ctx.destination);
      backingBus = ctx.createGain(); backingBus.gain.value = 0.8; backingBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      if (!recorder.stream) setSession('playback');
    }
    if (ctx.state !== 'running') ctx.resume().catch(() => {});
    return ctx;
  }

  // Karplus-Strong plucked string with fractional delay (accurate tuning)
  function ksBuffer(midi, dur = 2.4, bright = 0.6) {
    const key = midi + '|' + dur + '|' + bright;
    if (ksCache.has(key)) return ksCache.get(key);
    const sr = ctx.sampleRate, f = midiToFreq(midi);
    const len = Math.floor(sr * dur);
    const buf = ctx.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    const N = sr / f - 0.5;           // the 2-tap average adds ~0.5 sample of delay
    const Ni = Math.floor(N), p = N - Ni;
    const loss = Math.pow(0.001, 1 / (f * dur * 0.9));
    let lp = 0;
    for (let i = 0; i < Math.min(Ni + 2, len); i++) {
      const w = Math.random() * 2 - 1;
      lp += bright * (w - lp);
      d[i] = lp;
    }
    // y[n] = loss * 0.5 * (x[n-D'] + x[n-D'-1]) with linear interpolation of the fractional delay
    for (let i = Ni + 2; i < len; i++) {
      d[i] = loss * 0.5 * ((1 - p) * d[i - Ni] + d[i - Ni - 1] + p * d[i - Ni - 2]);
    }
    // remove DC + fade tail
    let mean = 0; for (let i = 0; i < len; i++) mean += d[i]; mean /= len;
    const fade = Math.floor(sr * 0.06);
    for (let i = 0; i < len; i++) {
      d[i] -= mean;
      if (i > len - fade) d[i] *= (len - i) / fade;
    }
    // normalise
    let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(d[i]));
    if (peak > 0) for (let i = 0; i < len; i++) d[i] /= peak;
    ksCache.set(key, buf);
    return buf;
  }

  function pluck(midi, when, opts = {}) {
    ensure();
    const { dur = 2.4, gain = 0.4, bright = 0.6, dest = sfxBus, cut = null, tone = 4200 } = opts;
    const src = ctx.createBufferSource();
    src.buffer = ksBuffer(midi, dur, bright);
    const g = ctx.createGain();
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = tone;
    g.gain.setValueAtTime(gain, when);
    if (cut) { g.gain.setValueAtTime(gain, when + cut); g.gain.exponentialRampToValueAtTime(0.0001, when + cut + 0.08); }
    src.connect(lp); lp.connect(g); g.connect(dest);
    src.start(when);
    src.stop(when + (cut ? cut + 0.1 : dur));
    return src;
  }

  function strum(midis, when, opts = {}) {
    const spread = opts.spread ?? 0.018;
    const n = midis.length;
    midis.forEach((m, i) => pluck(m, when + i * spread, { ...opts, gain: (opts.gain ?? 0.25) * (1 - i * 0.04) / Math.sqrt(n / 3) }));
  }

  function now() { ensure(); return ctx.currentTime; }
  // soft UI "bubble pop"
  function pop(bright = false) {
    try {
      ensure();
      const t = ctx.currentTime + 0.005;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine';
      const f0 = bright ? 520 : 380;
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f0 * 2.1, t + 0.05);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.06, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.1);
    } catch (e) {}
  }

  // ---- drums ----
  function kick(when, vol = 1, dest = backingBus) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, when);
    o.frequency.exponentialRampToValueAtTime(42, when + 0.13);
    g.gain.setValueAtTime(0.9 * vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.38);
    o.connect(g); g.connect(dest); o.start(when); o.stop(when + 0.4);
  }
  function snare(when, vol = 1, dest = backingBus) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200; bp.Q.value = 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.55 * vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.2);
    n.connect(bp); bp.connect(g); g.connect(dest); n.start(when); n.stop(when + 0.22);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = 190;
    og.gain.setValueAtTime(0.35 * vol, when); og.gain.exponentialRampToValueAtTime(0.001, when + 0.09);
    o.connect(og); og.connect(dest); o.start(when); o.stop(when + 0.1);
  }
  function hat(when, vol = 1, open = false, dest = backingBus) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    const g = ctx.createGain();
    const len = open ? 0.25 : 0.045;
    g.gain.setValueAtTime(0.22 * vol, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + len);
    n.connect(hp); hp.connect(g); g.connect(dest); n.start(when, Math.random() * 0.5); n.stop(when + len + 0.02);
  }
  function click(when, accent = false) {
    ensure();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = accent ? 2000 : 1400;
    g.gain.setValueAtTime(accent ? 0.25 : 0.15, when);
    g.gain.exponentialRampToValueAtTime(0.001, when + 0.03);
    o.connect(g); g.connect(backingBus); o.start(when); o.stop(when + 0.04);
  }
  function bass(midi, when, len, vol = 1) {
    pluck(midi, when, { dur: 1.6, gain: 0.55 * vol, bright: 0.35, dest: backingBus, cut: len, tone: 900 });
  }

  // ---- backing track styles ----
  // prog: list of [semitoneOffsetFromKeyRoot, chordType] — one bar each
  const STYLES = {
    rock:   { name: 'Rock',          tonality: 'minor', feel: 'straight', bpm: 100, xp: 0,
              prog: [[0,'min'],[8,'maj'],[3,'maj'],[10,'maj']], scales: ['minorPent','minor'], tone: 'Crunch / light overdrive' },
    blues:  { name: 'Blues shuffle', tonality: 'blues', feel: 'shuffle',  bpm: 84,  xp: 0,
              prog: [[0,'dom7'],[0,'dom7'],[0,'dom7'],[0,'dom7'],[5,'dom7'],[5,'dom7'],[0,'dom7'],[0,'dom7'],[7,'dom7'],[5,'dom7'],[0,'dom7'],[7,'dom7']],
              scales: ['blues','minorPent','majorPent'], tone: 'Edge-of-breakup + spring reverb' },
    metronome: { name: 'Metronome only', tonality: 'none', feel: 'straight', bpm: 80, xp: 0, prog: [[0,'maj']], scales: ['major','minorPent'], tone: 'Any' },
    pop:    { name: 'Pop',           tonality: 'major', feel: 'straight', bpm: 110, xp: 120,
              prog: [[0,'maj'],[9,'min'],[5,'maj'],[7,'maj']], scales: ['majorPent','major'], tone: 'Clean + chorus' },
    funk:   { name: 'Funk vamp',     tonality: 'minor', feel: 'straight', bpm: 96,  xp: 250,
              prog: [[0,'m7'],[0,'m7'],[5,'dom7'],[5,'dom7']], scales: ['dorian','minorPent'], tone: 'Clean, bright, a bit of compression' },
    ballad: { name: 'Slow ballad',   tonality: 'major', feel: 'straight', bpm: 68,  xp: 400,
              prog: [[0,'maj'],[7,'maj'],[9,'min'],[5,'maj']], scales: ['majorPent','major'], tone: 'Clean + delay + big reverb' },
    soul:   { name: 'Soul groove',   tonality: 'major', feel: 'straight', bpm: 88,  xp: 600,
              prog: [[0,'maj7'],[0,'maj7'],[5,'maj7'],[5,'maj7']], scales: ['major','majorPent'], tone: 'Warm clean, neck pickup' },
  };

  function bassMidi(pc) { let m = 28 + mod12(pc - 4); if (m > 38) m -= 12; return m; } // E1..D2

  function playStep(style, s, bar, t, sd, chordRoot, chordType, nextRoot) {
    const vox = chordVoicing(chordRoot, chordType);
    const b = bassMidi(chordRoot);
    const iv = CHORD_TYPES[chordType].iv;
    switch (style) {
      case 'metronome':
        if (s % 4 === 0) click(t, s === 0);
        break;
      case 'rock':
        if (s === 0 || s === 8 || s === 10) kick(t);
        if (s === 4 || s === 12) snare(t);
        if (s % 2 === 0) hat(t, s % 4 === 0 ? 0.9 : 0.6);
        if (s % 2 === 0) bass(b, t, sd * 1.8, 0.9);
        if (s === 0) strum(vox, t, { gain: 0.22, bright: 0.75, dest: backingBus, cut: sd * 7.5, tone: 3000 });
        if (s === 8) strum(vox, t, { gain: 0.18, bright: 0.75, dest: backingBus, cut: sd * 5.5, tone: 3000 });
        if (s === 14) strum(vox.slice(0, 3), t, { gain: 0.14, bright: 0.7, dest: backingBus, cut: sd * 1.5, tone: 3000 });
        break;
      case 'pop':
        if (s === 0 || s === 6 || s === 8) kick(t);
        if (s === 4 || s === 12) snare(t, 0.9);
        if (s % 2 === 0) hat(t, 0.7);
        if (s % 2 === 0) bass(b + (s === 6 || s === 14 ? 12 : 0), t, sd * 1.6, 0.85);
        if (s === 0 || s === 6 || s === 10) strum(vox, t, { gain: 0.16, bright: 0.8, dest: backingBus, cut: sd * 3.5, tone: 5000 });
        break;
      case 'funk':
        if (s === 0 || s === 7 || s === 10) kick(t);
        if (s === 4 || s === 12) snare(t);
        if (s === 14) snare(t, 0.25);
        hat(t, s % 2 === 0 ? 0.6 : 0.35);
        if ([0, 3, 6, 10, 11].includes(s)) bass(b + (s === 3 || s === 11 ? 12 : 0), t, sd * 0.9, 0.95);
        if ([2, 6, 9, 13].includes(s)) strum(vox.slice(1), t, { gain: 0.15, bright: 0.9, dest: backingBus, cut: sd * 0.7, spread: 0.008, tone: 6000 });
        break;
      case 'ballad': {
        if (s === 0 || s === 10) kick(t, 0.8);
        if (s === 8) snare(t, 0.6);
        if (s % 4 === 2) hat(t, 0.45);
        if (s === 0) bass(b, t, sd * 7.5, 0.8);
        if (s === 8) bass(b + iv[2], t, sd * 7.5, 0.7);
        if (s % 2 === 0) {
          const order = [0, 1, 2, 3, 4, 3, 2, 1];
          const m = vox[order[(s / 2) % order.length] % vox.length];
          pluck(m + 12, t, { gain: 0.16, bright: 0.55, dest: backingBus, dur: 2.0, tone: 3500 });
        }
        break;
      }
      case 'soul':
        if (s === 0 || s === 9) kick(t, 0.85);
        if (s === 4 || s === 12) snare(t, 0.55);
        hat(t, s % 2 === 0 ? 0.4 : 0.2);
        if (s === 0) bass(b, t, sd * 6, 0.85);
        if (s === 7) bass(b + iv[2], t, sd * 2.5, 0.75);
        if (s === 10) bass(b + 12, t, sd * 4, 0.75);
        if (s === 0 || s === 8) strum(vox, t, { gain: 0.13, bright: 0.4, dest: backingBus, cut: sd * 7, spread: 0.03, tone: 2200 });
        break;
      case 'blues': {
        // 12 steps per bar (triplet grid). Beats at 0,3,6,9; shuffle offbeat at +2
        if (s === 0 || s === 6) kick(t);
        if (s === 3 || s === 9) snare(t, 0.9);
        if (s % 3 === 0 || s % 3 === 2) hat(t, s % 3 === 0 ? 0.7 : 0.45);
        const walk = [0, 7, 9, 10];               // root, 5, 6, b7 boogie
        if (s % 3 === 0) bass(b + walk[s / 3], t, sd * 1.8, 0.9);
        if (s % 3 === 2) bass(b + walk[(s - 2) / 3], t, sd * 0.9, 0.6);
        if (s === 0) strum(vox, t, { gain: 0.17, bright: 0.7, dest: backingBus, cut: sd * 2.5, tone: 3200 });
        if (s === 5 || s === 11) strum(vox.slice(1, 4), t, { gain: 0.12, bright: 0.7, dest: backingBus, cut: sd * 0.8, tone: 3200 });
        break;
      }
    }
  }

  const backing = { playing: false, timer: null };

  function startBacking(cfg, cb = {}) {
    ensure();
    stopBacking();
    const st = STYLES[cfg.style];
    const stepsPerBar = st.feel === 'shuffle' ? 12 : 16;
    const sd = (60 / cfg.bpm) * 4 / stepsPerBar;
    const keyPc = pcOf(cfg.key);
    let step = 0, bar = 0;
    let next = ctx.currentTime + 0.12;
    backing.playing = true;
    backing.cfg = cfg;
    const tick = () => {
      while (next < ctx.currentTime + 0.18) {
        const p = st.prog[bar % st.prog.length];
        const np = st.prog[(bar + 1) % st.prog.length];
        const root = mod12(keyPc + p[0]);
        playStep(cfg.style, step, bar, next, sd, root, p[1], mod12(keyPc + np[0]));
        const delay = Math.max(0, (next - ctx.currentTime) * 1000);
        if (step === 0 && cb.onBar) { const b = bar; setTimeout(() => backing.playing && cb.onBar(b, root, p[1], np), delay); }
        if (cb.onBeat && step % (stepsPerBar / 4) === 0) { const beat = step / (stepsPerBar / 4); setTimeout(() => backing.playing && cb.onBeat(beat), delay); }
        next += sd;
        step++;
        if (step >= stepsPerBar) { step = 0; bar++; }
      }
    };
    tick();
    backing.timer = setInterval(tick, 25);
  }
  function stopBacking() {
    backing.playing = false;
    if (backing.timer) clearInterval(backing.timer);
    backing.timer = null;
  }
  function setBackingVolume(v) { ensure(); backingBus.gain.value = v; }

  // ---- recorder ----
  const recorder = { stream: null, src: null, inGain: null, analyser: null, mr: null, chunks: [], startedAt: 0, recDest: null, toRec: null, monitor: null };

  function pickMime() {
    if (!window.MediaRecorder) return '';
    const opts = ['audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (const m of opts) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
    return '';
  }

  async function openInput(deviceId) {
    ensure();
    if (recorder.stream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('This browser cannot record audio here. Open the app from your home screen (HTTPS).');
    setSession('play-and-record');
    const audio = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };
    if (deviceId) audio.deviceId = { exact: deviceId };
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio }); }
    catch (e) {
      if (deviceId) { delete audio.deviceId; stream = await navigator.mediaDevices.getUserMedia({ audio }); }
      else { setSession('playback'); throw e; }
    }
    recorder.stream = stream;
    recorder.src = ctx.createMediaStreamSource(stream);
    recorder.inGain = ctx.createGain();
    recorder.inGain.gain.value = 1;
    recorder.analyser = ctx.createAnalyser(); recorder.analyser.fftSize = 1024;
    recorder.src.connect(recorder.inGain); recorder.inGain.connect(recorder.analyser);
    if (ctx.state !== 'running') await ctx.resume();
    return true;
  }
  function setMonitor(on) {
    if (!recorder.inGain) return;
    if (on && !recorder.monitor) { recorder.monitor = ctx.createGain(); recorder.monitor.gain.value = 1; recorder.inGain.connect(recorder.monitor); recorder.monitor.connect(master); }
    if (!on && recorder.monitor) { try { recorder.inGain.disconnect(recorder.monitor); recorder.monitor.disconnect(); } catch (e) {} recorder.monitor = null; }
  }
  function setInputGain(v) { if (recorder.inGain) recorder.inGain.gain.value = v; }
  function level() {
    if (!recorder.analyser) return 0;
    const a = new Float32Array(recorder.analyser.fftSize);
    recorder.analyser.getFloatTimeDomainData(a);
    let pk = 0; for (const x of a) pk = Math.max(pk, Math.abs(x));
    return pk;
  }
  function closeInput() {
    if (recorder.mr && recorder.mr.state !== 'inactive') { try { recorder.mr.stop(); } catch (e) {} }
    setMonitor(false);
    if (recorder.stream) recorder.stream.getTracks().forEach(t => t.stop());
    try { recorder.src && recorder.src.disconnect(); } catch (e) {}
    recorder.stream = recorder.src = recorder.inGain = recorder.analyser = null;
    setSession('playback');
  }

  function startRecording({ includeBacking = true, backingLevel = 0.6 } = {}) {
    if (!recorder.stream) throw new Error('Input not open');
    const mime = pickMime();
    let streamToRecord = null;
    try {
      recorder.recDest = ctx.createMediaStreamDestination();
      recorder.inGain.connect(recorder.recDest);
      if (includeBacking) {
        recorder.toRec = ctx.createGain(); recorder.toRec.gain.value = backingLevel;
        backingBus.connect(recorder.toRec); recorder.toRec.connect(recorder.recDest);
      }
      streamToRecord = recorder.recDest.stream;
    } catch (e) { streamToRecord = recorder.stream; }
    let mr;
    try { mr = mime ? new MediaRecorder(streamToRecord, { mimeType: mime }) : new MediaRecorder(streamToRecord); }
    catch (e) { mr = new MediaRecorder(recorder.stream); }
    recorder.chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) recorder.chunks.push(e.data); };
    mr.start(500);
    recorder.mr = mr;
    recorder.startedAt = performance.now();
  }
  function stopRecording() {
    return new Promise(resolve => {
      const mr = recorder.mr;
      if (!mr) return resolve(null);
      const duration = (performance.now() - recorder.startedAt) / 1000;
      mr.onstop = () => {
        const type = mr.mimeType || (recorder.chunks[0] && recorder.chunks[0].type) || 'audio/mp4';
        const blob = new Blob(recorder.chunks, { type });
        try { recorder.recDest && recorder.inGain && recorder.inGain.disconnect(recorder.recDest); } catch (e) {}
        try { if (recorder.toRec) { backingBus.disconnect(recorder.toRec); recorder.toRec.disconnect(); } } catch (e) {}
        recorder.toRec = null; recorder.recDest = null; recorder.mr = null;
        resolve({ blob, mime: type, duration });
      };
      try { mr.stop(); } catch (e) { resolve(null); }
    });
  }
  function isRecording() { return !!(recorder.mr && recorder.mr.state === 'recording'); }
  function elapsed() { return isRecording() ? (performance.now() - recorder.startedAt) / 1000 : 0; }

  async function listInputs() {
    try {
      const devs = await navigator.mediaDevices.enumerateDevices();
      return devs.filter(d => d.kind === 'audioinput');
    } catch (e) { return []; }
  }

  return {
    ensure, now, pop, pluck, strum, click, STYLES,
    startBacking, stopBacking, setBackingVolume, get backingPlaying() { return backing.playing; },
    openInput, closeInput, startRecording, stopRecording, isRecording, elapsed, level, setMonitor, setInputGain, listInputs,
    get inputOpen() { return !!recorder.stream; },
  };
})();

// Fretboard mark helper: all positions of given pitch classes inside a fret window
function marksFor(pcs, rootPc, from, to, strings = [0,1,2,3,4,5], labeler) {
  const out = [];
  for (const s of strings) for (let f = from; f <= to; f++) {
    const pc = fretPc(s, f);
    if (pcs.includes(pc)) out.push({ s, f, label: labeler ? labeler(pc) : noteName(pc), root: pc === rootPc });
  }
  return out;
}
function scaleMarks(key, scaleKey, from, to, strings, useDegrees = false) {
  const r = pcOf(key), pcs = scalePcs(r, scaleKey), sc = SCALES[scaleKey];
  return marksFor(pcs, r, from, to, strings, pc => useDegrees ? sc.degrees[pcs.indexOf(pc)] : noteName(pc, FLAT_KEYS.has(key)));
}

const Store = {
  state: null,
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null'); } catch (e) {}
    const d = defaultState();
    this.state = s ? { ...d, ...s, ear: { ...d.ear, ...(s.ear || {}) }, settings: { ...d.settings, ...(s.settings || {}) } } : d;
    return this.state;
  },
  save() { try { localStorage.setItem(STATE_KEY, JSON.stringify(this.state)); } catch (e) {} },
  reset() { this.state = defaultState(); this.save(); },
};

// ---- dates & weeks ----
function todayStr(d = new Date()) {
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function weekKey(d = new Date()) {
  // ISO week, Monday start
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wk = Math.ceil(((t - y0) / 86400000 + 1) / 7);
  return `${t.getUTCFullYear()}-W${String(wk).padStart(2, '0')}`;
}
function sessionsThisWeek() {
  const wk = weekKey();
  return Store.state.sessions.filter(s => s.counted && weekKey(new Date(s.date)) === wk).length;
}
function weekStreak() {
  // consecutive successful weeks, ending with this week (if already met) or last week
  const goal = Store.state.settings.weeklyGoal;
  const counts = {};
  Store.state.sessions.forEach(s => { if (s.counted) { const k = weekKey(new Date(s.date)); counts[k] = (counts[k] || 0) + 1; } });
  let streak = 0;
  const d = new Date();
  if ((counts[weekKey(d)] || 0) >= goal) streak++;
  d.setDate(d.getDate() - 7);
  for (let i = 0; i < 520; i++) {
    if ((counts[weekKey(d)] || 0) >= goal) { streak++; d.setDate(d.getDate() - 7); }
    else break;
  }
  return streak;
}
function daysSinceLastSession() {
  const c = Store.state.sessions.filter(s => s.counted);
  if (!c.length) return null;
  const last = new Date(c[c.length - 1].date);
  const a = new Date(todayStr()), b = new Date(todayStr(last));
  return Math.round((a - b) / 86400000);
}

const XP_PER_LEVEL = 150;
function levelInfo(xp = Store.state.xp) {

  return { lvl, title: LEVEL_TITLES[Math.min(lvl - 1, LEVEL_TITLES.length - 1)], into: xp % XP_PER_LEVEL, need: XP_PER_LEVEL };

function addXP(n, why) {

  if (Store.state.xpLog.length > 200) Store.state.xpLog = Store.state.xpLog.slice(-200);

  UI.toast(`+${n} XP · ${why}`);
  if (after.lvl > before.lvl) setTimeout(() => UI.celebrate(`Level ${after.lvl}!`, after.title), 600);
  if (unlockedNow.length) setTimeout(() => UI.celebrate('Unlocked!', `New backing track: ${unlockedNow.join(', ')}`), 1400);
}

function earRecord(level, correct) {
  const h = Store.state.ear.history[level] || [];
  h.push(correct ? 1 : 0);
  Store.state.ear.history[level] = h.slice(-30);
  const recent = Store.state.ear.history[level].slice(-20);
  if (recent.length >= 20 && recent.reduce((a, b) => a + b, 0) >= 16) {
    if (Store.state.ear.unlocked === level && level < EAR_LEVELS.length) {
      Store.state.ear.unlocked = level + 1;
      setTimeout(() => UI.celebrate('Ear level unlocked!', EAR_LEVELS[level].name), 500);

    if (!Store.state.ear.typedAvail) Store.state.ear.typedAvail = {};

      Store.state.ear.typedAvail[level] = true;
      setTimeout(() => UI.toast('Typed answers unlocked for this level'), 1200);
    }
  }
  Store.save();
}

  const h = (Store.state.ear.history[level] || []).slice(-20);

// ---------- IndexedDB for recordings ----------
const RecDB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('woodshed', 1);
      r.onupgradeneeded = () => { const db = r.result; if (!db.objectStoreNames.contains('recs')) db.createObjectStore('recs', { keyPath: 'id' }); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('recs', mode);
      const st = t.objectStore('recs');
      const out = fn(st);
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  }
  return {
    async put(rec) { return tx('readwrite', st => st.put(rec)); },
    async del(id) { return tx('readwrite', st => st.delete(id)); },
    async all() {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('recs', 'readonly');
        const r = t.objectStore('recs').getAll();
        r.onsuccess = () => res((r.result || []).sort((a, b) => b.createdAt - a.createdAt));
        r.onerror = () => rej(r.error);
      });
    },
    async get(id) {
      const db = await open();
      return new Promise((res, rej) => {
        const r = db.transaction('recs', 'readonly').objectStore('recs').get(id);
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    },
  };
})();

}

// ---------- UI helpers ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }

  }

    const fb = Fretboard({
      from: Math.max(0, q.from - 1), to: Math.min(15, q.to + 1), marks: q.shown || [],
      onTap: (st, f) => {

      h('div', { class: 'badge accent' }, cfg.game === 'findNote' ? `⏱ ${timeLeft}s · ${score} pts` : `Round ${Math.min(round + 1, TOTAL)}/${TOTAL} · ${score} pts`));
  }
  function end() {
    clearInterval(timer);
    const key = 'game:' + cfg.game + ':' + (cfg.strings || []).join('');
    const best = Store.state.drills[key] || 0;
    const isBest = score > best;
    if (isBest) { Store.state.drills[key] = score; Store.save(); }
    area.innerHTML = ''; prompt.textContent = '';
    area.appendChild(h('div', { class: 'card center stack' },
      h('div', { style: { fontSize: '44px' } }, isBest ? '🥇' : '🎯'),
      h('h2', null, `${score} points`),
      h('p', { class: 'muted' }, isBest ? 'New personal best!' : `Best: ${best}`),
      h('div', { class: 'row' },
        h('button', { class: 'btn grow', onclick: () => { root.replaceWith(GameView(cfg, onDone)); } }, 'Again'),
        onDone ? h('button', { class: 'btn primary grow', onclick: () => onDone(score) }, 'Continue') : null)));
    addXP(5, 'Fretboard game');
  }
  function next() {
    if (cfg.game !== 'findNote' && round >= TOTAL) return end();
    setHead();
    area.innerHTML = '';
    ({ nameNote, findNote, interval, chordTones })[cfg.game]();
  }
  function nameNote() {
    const st = pick(strings), f = randInt(from, to);
    const pc = fretPc(st, f);
    prompt.textContent = 'What note is this?';
    const fb = Fretboard({ from, to, marks: [{ s: st, f, label: '?', cls: 'shown' }] });
    area.appendChild(fb); fb.scrollToFret(f);
    const opts = shuffle([pc, ...shuffle([...Array(12).keys()].filter(x => x !== pc)).slice(0, 3)]);
    const grid = h('div', { class: 'grid2', style: { marginTop: '12px' } });
    opts.forEach(o => grid.appendChild(h('button', { class: 'option center', onclick: e => {
      if (grid.dataset.done) return; grid.dataset.done = 1;
      AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.35 });
      if (o === pc) { score++; e.target.classList.add('right'); } else { e.target.classList.add('wrong'); [...grid.children][opts.indexOf(pc)].classList.add('right'); }
      round++; setTimeout(next, o === pc ? 450 : 1100);
    } }, bothNames(o))));
    area.appendChild(grid);
  }
  function findNote() {
    const pc = randInt(0, 11);
    const targets = [];
    for (const st of strings) for (let f = from; f <= to; f++) if (fretPc(st, f) === pc) targets.push(st + ':' + f);
    const found = new Set();
    prompt.innerHTML = '';
    prompt.append('Find every ', h('span', { style: { color: 'var(--accent)' } }, bothNames(pc)));
    const fb = Fretboard({ from, to, onTap: (st, f) => {
      if (!started) return;
      const k = st + ':' + f;
      if (targets.includes(k) && !found.has(k)) {
        found.add(k); score++; setHead();
        fb.addMark({ s: st, f, label: noteName(pc), cls: 'good' });
        AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.3 });
        if (found.size === targets.length) setTimeout(next, 300);
      } else if (!targets.includes(k)) {
        score = Math.max(0, score - 1); setHead();
        const m = fb.addMark({ s: st, f, label: noteName(fretPc(st, f)), cls: 'bad' }); setTimeout(() => m.remove(), 500);
      }
    } });
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, `${targets.length} to find on these strings. Scroll for higher frets.`));
  }
  function interval() {
    const set = cfg.set || [3, 4, 7, 12];
    const iv = pick(set);
    const st = randInt(0, 2), f = randInt(3, 8);
    const rootPc = fretPc(st, f), target = mod12(rootPc + iv);
    const ivInfo = INTERVALS.find(x => x.semi === iv);
    prompt.innerHTML = '';
    prompt.append('Tap the ', h('span', { style: { color: 'var(--accent)' } }, ivInfo.name), ' above ', noteName(rootPc));
    let done = false;
    const fb = Fretboard({ from: Math.max(0, f - 3), to: Math.min(15, f + 6), marks: [{ s: st, f, label: 'R', root: true }], onTap: (s2, f2) => {
      if (done) return;
      const p = fretMidi(s2, f2) - fretMidi(st, f);
      const ok = fretPc(s2, f2) === target && p > 0 && (iv !== 12 || p === 12 || p === 24);
      AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.3 });
      AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now() + 0.35, { gain: 0.3 });
      if (ok) { done = true; score++; fb.addMark({ s: s2, f: f2, label: ivInfo.short, cls: 'good' }); round++; setTimeout(next, 900); }
      else { const m = fb.addMark({ s: s2, f: f2, label: '✕', cls: 'bad' }); setTimeout(() => m.remove(), 600); score = Math.max(0, score - 0); round += 0; fb.dataset.miss = (+fb.dataset.miss || 0) + 1; if (+fb.dataset.miss >= 3) { done = true; showAnswer(); } }
    } });
    function showAnswer() {
      for (let s2 = 0; s2 < 6; s2++) for (let f2 = Math.max(0, f - 3); f2 <= Math.min(15, f + 6); f2++) {
        const p = fretMidi(s2, f2) - fretMidi(st, f);
        if (fretPc(s2, f2) === target && p > 0) fb.addMark({ s: s2, f: f2, label: ivInfo.short, cls: 'shown' });
      }
      round++; setTimeout(next, 1800);
    }
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, 'Must be higher than the root. 3 tries.'));
  }
  function chordTones() {
    const types = cfg.types || ['maj'];
    const type = pick(types), rootPc = randInt(0, 11);
    const iv = CHORD_TYPES[type].iv;
    const idx = cfg.only !== undefined ? cfg.only : randInt(0, iv.length - 1);
    const names = ['root', '3rd', '5th', '7th'];
    const target = mod12(rootPc + iv[idx]);
    const flats = FLAT_KEYS.has(noteName(rootPc, true)) || [5, 10, 3, 8, 1].includes(rootPc);
    prompt.innerHTML = '';
    prompt.append('Tap the ', h('span', { style: { color: 'var(--accent)' } }, names[idx]), ' of ', h('b', null, chordName(rootPc, type, flats)));
    let done = false, miss = 0;
    const fb = Fretboard({ from: 0, to: 12, onTap: (s2, f2) => {
      if (done) return;
      if (fretPc(s2, f2) === target) {
        done = true; score++;
        fb.addMark({ s: s2, f: f2, label: noteName(target, flats), cls: 'good' });
        AudioEngine.strum(chordVoicing(rootPc, type), AudioEngine.now(), { gain: 0.2 });
        AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now() + 0.5, { gain: 0.4 });
        round++; setTimeout(next, 1100);
      } else {
        miss++;
        const m = fb.addMark({ s: s2, f: f2, label: noteName(fretPc(s2, f2), flats), cls: 'bad' }); setTimeout(() => m.remove(), 600);
        if (miss >= 3) { done = true; area.appendChild(h('p', { class: 'center' }, `The ${names[idx]} of ${chordName(rootPc, type, flats)} is `, h('b', null, noteName(target, flats)))); round++; setTimeout(next, 1800); }
      }
    } });
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, `${chordName(rootPc, type, flats)} = ${iv.map(i => noteName(rootPc + i, flats)).map((n, i) => i === idx ? '?' : n).join(' ')}`));
  }

  // intro screen
  setHead();
  prompt.textContent = '';
  area.appendChild(h('div', { class: 'card stack' }, h('h3', null, cfg.title), h('p', { class: 'muted' }, cfg.how),
    h('button', { class: 'btn primary block', onclick: () => {
      AudioEngine.ensure(); started = true;
      if (cfg.game === 'findNote') {
        timer = setInterval(() => { timeLeft--; setHead(); if (timeLeft <= 0) end(); }, 1000);
      }
      next();
    } }, 'Start')));
  root.cleanup = () => clearInterval(timer);
  return root;
}

// ---------- Drill with metronome ----------
function DrillView(cfg, lessonId, onDone) {
  let bpm = Store.state.drills[lessonId] || cfg.bpm || 70;
  let running = false, timer = null, beatN = 0;
  const bpmEl = h('div', { class: 'timer', style: { fontSize: '40px' } }, bpm);
  const beats = h('div', { class: 'row', style: { justifyContent: 'center' } }, [0,1,2,3].map(() => h('i', { class: 'beat' })));
  const startBtn = h('button', { class: 'btn primary grow', onclick: toggle }, '▶ Metronome');
  function tick() {
    const t = AudioEngine.now() + 0.02;
    AudioEngine.click(t, beatN % 4 === 0);
    const b = beatN % 4;
    [...beats.children].forEach((x, i) => x.classList.toggle('on', i === b));
    beatN++;
  }
  function restart() { clearInterval(timer); beatN = 0; tick(); timer = setInterval(tick, 60000 / bpm); }
  function toggle() {
    AudioEngine.ensure();
    running = !running;
    startBtn.textContent = running ? '■ Stop' : '▶ Metronome';
    if (running) restart(); else { clearInterval(timer); [...beats.children].forEach(x => x.classList.remove('on')); }
  }
  function setBpm(v) { bpm = Math.max(40, Math.min(220, v)); bpmEl.textContent = bpm; if (running) restart(); }
  const best = Store.state.drills[lessonId];
  const root = h('div', { class: 'stack' },
    h('div', { class: 'card stack' }, h('h3', null, cfg.title), h('p', { class: 'muted' }, cfg.how),
      cfg.fb ? (() => { const fb = Fretboard({ from: cfg.fb.from, to: cfg.fb.to, marks: cfg.fb.marks(), onTap: (st, f) => AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.35 }) }); if (cfg.fb.from > 3) fb.scrollToFret(cfg.fb.from + 2); return fb; })() : null),
    h('div', { class: 'card stack center' },
      h('div', { class: 'tiny' }, 'Tempo (BPM)'),
      h('div', { class: 'row', style: { justifyContent: 'center', gap: '18px' } },
        h('button', { class: 'iconbtn', onclick: () => setBpm(bpm - 5) }, '−5'), bpmEl, h('button', { class: 'iconbtn', onclick: () => setBpm(bpm + 5) }, '+5')),
      beats,
      h('div', { class: 'row' }, startBtn),
      h('p', { class: 'muted small' }, best ? `Your best clean tempo: ${best} BPM. Try +5.` : 'Start slow. Raise the tempo only when it’s clean.'),
      h('button', { class: 'btn block', onclick: () => {
        const prev = Store.state.drills[lessonId] || 0;
        if (bpm > prev) { Store.state.drills[lessonId] = bpm; Store.save(); UI.toast(`New best: ${bpm} BPM`); addXP(5, 'Tempo record'); }
        else UI.toast(`Saved. Best is still ${prev} BPM`);
      } }, '✓ I played it clean at this tempo')),
    onDone ? h('button', { class: 'btn primary block', onclick: () => { clearInterval(timer); onDone(); } }, 'Continue') : null);
  root.cleanup = () => clearInterval(timer);
  return root;
}

          };

          st.lastTone = rec.tone; Store.save();

    root.appendChild(h('div', { class: 'card stack' },

  return root;
}

// ---------- Ear training ----------
// Fretboard showing every place a note (or a pair of notes) lives, for the answer reveal
function notePositionsBoard(pcs, rootPc, to = 12) {
  const marks = [];
  for (let st = 0; st < 6; st++) for (let f = 0; f <= to; f++) {
    const pc = fretPc(st, f);
    if (pcs.includes(pc)) marks.push({ s: st, f, label: noteName(pc), root: pc === rootPc });
  }
  return Fretboard({ from: 0, to, marks, fretWidth: 40, onTap: (s2, f2) => AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now(), { gain: 0.35 }) });
}
function playShape(rootPc, type, t, opts = {}) {
  const ms = shapeMidis(rootPc, type);
  AudioEngine.strum(ms, t, { gain: 0.32, spread: 0.035, ...opts });
  return ms;
}
function howTo(title, ...els) { return h('div', { class: 'howto' }, h('div', { class: 'tiny' }, title), ...els); }

function makeEarQuestion(level) {
  const now = () => AudioEngine.now() + 0.05;
  if (level === 'N') {
    // single note, no reference: guess the note
    const m = randInt(52, 66), pc = mod12(m);
    const playFn = () => { const t = now(); AudioEngine.pluck(m, t, { gain: 0.45 }); AudioEngine.pluck(m, t + 1.1, { gain: 0.35 }); };
    const opts = shuffle([pc, ...shuffle([...Array(12).keys()].filter(x => x !== pc)).slice(0, 3)]).map(bothNames);
    return { level, tag: 'Note', prompt: 'Which note is this?', play: playFn, options: opts, answer: bothNames(pc), accept: v => pcOf(v) === pc, reveal: bothNames(pc),
      refBtn: () => AudioEngine.pluck(57, AudioEngine.now(), { gain: 0.4 }), refHint: 'Stuck? Tap A to hear an A for comparison.',
      show: () => howTo(`Where to play ${bothNames(pc)} (tap to hear)`, notePositionsBoard([pc], pc)) };
  }
