      h('h2', null, reviewIds ? 'Review done' : 'Lesson complete'),
      h('p', { class: 'muted' }, `${correct} / ${quiz.length} correct. Missed questions will come back in your reviews.`),
      h('button', { class: 'btn primary block', onclick: () => opts.onDone && opts.onDone({ correct, total: quiz.length }) }, opts.doneLabel || 'Continue')));
    addXP(xp, reviewIds ? 'Review' : 'Lesson');
    if (correct === quiz.length && quiz.length) setTimeout(() => confetti(70), 150);
  }
  render();
  return root;
}

// ---------- Fretboard games ----------
function GameView(cfg, onDone) {
  const root = h('div', { class: 'stack' });
  const TOTAL = cfg.game === 'findNote' ? 30 : 10; // seconds for findNote, rounds otherwise
  let round = 0, score = 0, timeLeft = TOTAL, timer = null, started = false;
  const head = h('div', { class: 'row between' });
  const prompt = h('h2', { class: 'center' });
  const area = h('div');
  root.append(head, prompt, area);
  const from = cfg.from ?? 0, to = cfg.to ?? 12, strings = cfg.strings || [0,1,2,3,4,5];

  function setHead() {
    head.innerHTML = '';
    head.append(h('div', { class: 'tiny' }, cfg.title || 'Game'),
      h('div', { class: 'badge accent' }, cfg.game === 'findNote' ? `⏱ ${timeLeft}s · ${score} pts` : `Round ${Math.min(round + 1, TOTAL)}/${TOTAL} · ${score} pts`));
  }
  function end() {
    clearInterval(timer);
    const key = 'game:' + cfg.game + ':' + (cfg.strings || []).join('');
    const best = Store.state.drills[key] || 0;
    const isBest = score > best;
    if (isBest) { Store.state.drills[key] = score; Store.save(); }
    area.innerHTML = ''; prompt.textContent = '';
    area.appendChild(h('div', { class: 'card center stack' },
      h('div', { style: { fontSize: '44px' } }, isBest ? '🥇' : '🎯'),
      h('h2', null, `${score} points`),
      h('p', { class: 'muted' }, isBest ? 'New personal best!' : `Best: ${best}`),
      h('div', { class: 'row' },
        h('button', { class: 'btn grow', onclick: () => { root.replaceWith(GameView(cfg, onDone)); } }, 'Again'),
        onDone ? h('button', { class: 'btn primary grow', onclick: () => onDone(score) }, 'Continue') : null)));
    addXP(5, 'Fretboard game');
  }
  function next() {
    if (cfg.game !== 'findNote' && round >= TOTAL) return end();
    setHead();
    area.innerHTML = '';
    ({ nameNote, findNote, interval, chordTones })[cfg.game]();
  }
  function nameNote() {
    const st = pick(strings), f = randInt(from, to);
    const pc = fretPc(st, f);
    prompt.textContent = 'What note is this?';
    const fb = Fretboard({ from, to, marks: [{ s: st, f, label: '?', cls: 'shown' }] });
    area.appendChild(fb); fb.scrollToFret(f);
    const opts = shuffle([pc, ...shuffle([...Array(12).keys()].filter(x => x !== pc)).slice(0, 3)]);
    const grid = h('div', { class: 'grid2', style: { marginTop: '12px' } });
    opts.forEach(o => grid.appendChild(h('button', { class: 'option center', onclick: e => {
      if (grid.dataset.done) return; grid.dataset.done = 1;
      AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.35 });
      if (o === pc) { score++; e.target.classList.add('right'); sfx('chime'); } else { sfx('nope'); e.target.classList.add('wrong'); [...grid.children][opts.indexOf(pc)].classList.add('right'); }
      round++; setTimeout(next, o === pc ? 450 : 1100);
    } }, bothNames(o))));
    area.appendChild(grid);
  }
  function findNote() {
    const pc = randInt(0, 11);
    const targets = [];
    for (const st of strings) for (let f = from; f <= to; f++) if (fretPc(st, f) === pc) targets.push(st + ':' + f);
    const found = new Set();
    prompt.innerHTML = '';
    prompt.append('Find every ', h('span', { style: { color: 'var(--accent)' } }, bothNames(pc)));
    const fb = Fretboard({ from, to, onTap: (st, f) => {
      if (!started) return;
      const k = st + ':' + f;
      if (targets.includes(k) && !found.has(k)) {
        found.add(k); score++; setHead();
        fb.addMark({ s: st, f, label: noteName(pc), cls: 'good' });
        AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.3 });
        if (found.size === targets.length) setTimeout(next, 300);
      } else if (!targets.includes(k)) {
        score = Math.max(0, score - 1); setHead();
        const m = fb.addMark({ s: st, f, label: noteName(fretPc(st, f)), cls: 'bad' }); setTimeout(() => m.remove(), 500);
      }
    } });
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, `${targets.length} to find on these strings. Scroll for higher frets.`));
  }
  function interval() {
    const set = cfg.set || [3, 4, 7, 12];
    const iv = pick(set);
    const st = randInt(0, 2), f = randInt(3, 8);
    const rootPc = fretPc(st, f), target = mod12(rootPc + iv);
    const ivInfo = INTERVALS.find(x => x.semi === iv);
    prompt.innerHTML = '';
    prompt.append('Tap the ', h('span', { style: { color: 'var(--accent)' } }, ivInfo.name), ' above ', noteName(rootPc));
    let done = false;
    const fb = Fretboard({ from: Math.max(0, f - 3), to: Math.min(15, f + 6), marks: [{ s: st, f, label: 'R', root: true }], onTap: (s2, f2) => {
      if (done) return;
      const p = fretMidi(s2, f2) - fretMidi(st, f);
      const ok = fretPc(s2, f2) === target && p > 0 && (iv !== 12 || p === 12 || p === 24);
      AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.3 });
      AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now() + 0.35, { gain: 0.3 });
      if (ok) { done = true; score++; fb.addMark({ s: s2, f: f2, label: ivInfo.short, cls: 'good' }); round++; setTimeout(next, 900); }
      else { sfx('nope'); const m = fb.addMark({ s: s2, f: f2, label: '✕', cls: 'bad' }); setTimeout(() => m.remove(), 600); score = Math.max(0, score - 0); round += 0; fb.dataset.miss = (+fb.dataset.miss || 0) + 1; if (+fb.dataset.miss >= 3) { done = true; showAnswer(); } }
    } });
    function showAnswer() {
      for (let s2 = 0; s2 < 6; s2++) for (let f2 = Math.max(0, f - 3); f2 <= Math.min(15, f + 6); f2++) {
        const p = fretMidi(s2, f2) - fretMidi(st, f);
        if (fretPc(s2, f2) === target && p > 0) fb.addMark({ s: s2, f: f2, label: ivInfo.short, cls: 'shown' });
      }
      round++; setTimeout(next, 1800);
    }
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, 'Must be higher than the root. 3 tries.'));
  }
  function chordTones() {
    const types = cfg.types || ['maj'];
    const type = pick(types), rootPc = randInt(0, 11);
    const iv = CHORD_TYPES[type].iv;
    const idx = cfg.only !== undefined ? cfg.only : randInt(0, iv.length - 1);
    const names = ['root', '3rd', '5th', '7th'];
    const target = mod12(rootPc + iv[idx]);
    const flats = FLAT_KEYS.has(noteName(rootPc, true)) || [5, 10, 3, 8, 1].includes(rootPc);
    prompt.innerHTML = '';
    prompt.append('Tap the ', h('span', { style: { color: 'var(--accent)' } }, names[idx]), ' of ', h('b', null, chordName(rootPc, type, flats)));
    let done = false, miss = 0;
    const fb = Fretboard({ from: 0, to: 12, onTap: (s2, f2) => {
      if (done) return;
      if (fretPc(s2, f2) === target) {
        done = true; score++;
        fb.addMark({ s: s2, f: f2, label: noteName(target, flats), cls: 'good' });
        AudioEngine.strum(chordVoicing(rootPc, type), AudioEngine.now(), { gain: 0.2 });
        AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now() + 0.5, { gain: 0.4 });
        round++; setTimeout(next, 1100);
      } else {
        miss++;
        const m = fb.addMark({ s: s2, f: f2, label: noteName(fretPc(s2, f2), flats), cls: 'bad' }); setTimeout(() => m.remove(), 600);
        if (miss >= 3) { done = true; area.appendChild(h('p', { class: 'center' }, `The ${names[idx]} of ${chordName(rootPc, type, flats)} is `, h('b', null, noteName(target, flats)))); round++; setTimeout(next, 1800); }
      }
    } });
    area.appendChild(fb);
    area.appendChild(h('p', { class: 'muted small center' }, `${chordName(rootPc, type, flats)} = ${iv.map(i => noteName(rootPc + i, flats)).map((n, i) => i === idx ? '?' : n).join(' ')}`));
  }

  // intro screen
  setHead();
  prompt.textContent = '';
  area.appendChild(h('div', { class: 'card stack' }, h('h3', null, cfg.title), h('p', { class: 'muted' }, cfg.how),
    h('button', { class: 'btn primary block', onclick: () => {
      AudioEngine.ensure(); started = true;
      if (cfg.game === 'findNote') {
        timer = setInterval(() => { timeLeft--; setHead(); if (timeLeft <= 0) end(); }, 1000);
      }
      next();
    } }, 'Start')));
  root.cleanup = () => clearInterval(timer);
  return root;
}

// ---------- Drill with metronome ----------
function DrillView(cfg, lessonId, onDone) {
  let bpm = Store.state.drills[lessonId] || cfg.bpm || 70;
  let running = false, timer = null, beatN = 0;
  const bpmEl = h('div', { class: 'timer', style: { fontSize: '40px' } }, bpm);
  const beats = h('div', { class: 'row', style: { justifyContent: 'center' } }, [0,1,2,3].map(() => h('i', { class: 'beat' })));
  const startBtn = h('button', { class: 'btn primary grow', onclick: toggle }, '▶ Metronome');
  function tick() {
    const t = AudioEngine.now() + 0.02;
    AudioEngine.click(t, beatN % 4 === 0);
    const b = beatN % 4;
    [...beats.children].forEach((x, i) => x.classList.toggle('on', i === b));
    beatN++;
  }
  function restart() { clearInterval(timer); beatN = 0; tick(); timer = setInterval(tick, 60000 / bpm); }
  function toggle() {
    AudioEngine.ensure();
    running = !running;
    startBtn.textContent = running ? '■ Stop' : '▶ Metronome';
    if (running) restart(); else { clearInterval(timer); [...beats.children].forEach(x => x.classList.remove('on')); }
  }
  function setBpm(v) { bpm = Math.max(40, Math.min(220, v)); bpmEl.textContent = bpm; if (running) restart(); }
  const best = Store.state.drills[lessonId];
  const root = h('div', { class: 'stack' },
    h('div', { class: 'card stack' }, h('h3', null, cfg.title), h('p', { class: 'muted' }, cfg.how),
      cfg.pre ? h('pre', { class: 'tab' }, cfg.pre) : null,
      cfg.fb ? (() => { const fb = Fretboard({ from: cfg.fb.from, to: cfg.fb.to, marks: cfg.fb.marks(), onTap: (st, f) => AudioEngine.pluck(fretMidi(st, f), AudioEngine.now(), { gain: 0.35 }) }); if (cfg.fb.from > 3) fb.scrollToFret(cfg.fb.from + 2); return fb; })() : null),
    h('div', { class: 'card stack center' },
      h('div', { class: 'tiny' }, 'Tempo (BPM)'),
      h('div', { class: 'row', style: { justifyContent: 'center', gap: '18px' } },
        h('button', { class: 'iconbtn', onclick: () => setBpm(bpm - 5) }, '−5'), bpmEl, h('button', { class: 'iconbtn', onclick: () => setBpm(bpm + 5) }, '+5')),
      beats,
      h('div', { class: 'row' }, startBtn),
      h('p', { class: 'muted small' }, best ? `Your best clean tempo: ${best} BPM. Try +5.` : 'Start slow. Raise the tempo only when it’s clean.'),
      h('button', { class: 'btn block', onclick: () => {
        const prev = Store.state.drills[lessonId] || 0;
        if (bpm > prev) { Store.state.drills[lessonId] = bpm; Store.save(); UI.toast(`New best: ${bpm} BPM`); addXP(5, 'Tempo record'); }
        else UI.toast(`Saved. Best is still ${prev} BPM`);
      } }, '✓ I played it clean at this tempo')),
    onDone ? h('button', { class: 'btn primary block', onclick: () => { clearInterval(timer); onDone(); } }, 'Continue') : null);
  root.cleanup = () => clearInterval(timer);
  return root;
}

// ---------- Studio: backing track + recording ----------
// cfg: {style, key, bpm, scale, prompt, tone, target, title, challenge}
function StudioView(cfg = {}, opts = {}) {
  const st = Store.state;
  let style = cfg.style && styleUnlocked(cfg.style) ? cfg.style : (cfg.style ? 'rock' : (st.lastStudio?.style || 'rock'));
  let key = cfg.key || st.lastStudio?.key || 'A';
  let bpm = cfg.bpm || AudioEngine.STYLES[style].bpm;
  let scale = cfg.scale || AudioEngine.STYLES[style].scales[0];
  let curChord = null, nextChord = null;
  let meterRAF = null, recTimer = null;
  const root = h('div', { class: 'stack' });

  const flatsFor = k => FLAT_KEYS.has(k) || ['F','Bb','Eb','Ab','Db','Gb'].includes(k);
  function keyLabel() {
    const t = AudioEngine.STYLES[style].tonality;
    return t === 'minor' ? `${key} minor` : t === 'major' ? `${key} major` : t === 'blues' ? `${key} blues` : key;
  }

  const chordEl = h('div', { class: 'chordbig' }, '–');
  const nextEl = h('div', { class: 'muted small' }, '');
  const targetEl = h('div', { class: 'small', style: { color: 'var(--accent2)' } });
  const beatsEl = h('div', { class: 'row', style: { justifyContent: 'center' } }, [0,1,2,3].map(() => h('i', { class: 'beat' })));
  const playBtn = h('button', { class: 'btn grow', onclick: () => togglePlay() }, '▶ Play backing');
  const meter = h('div', { class: 'meter grow' }, h('i'));
  const recTime = h('div', { class: 'timer' }, '0:00');
  const recBtn = h('button', { class: 'recbtn', onclick: () => toggleRec(), 'aria-label': 'Record' }, h('span'));
  const recStatus = h('p', { class: 'muted small center' }, 'Plug in your Pulze Mini, then tap to record.');
  const fbHolder = h('div');

  function renderFretboard() {
    fbHolder.innerHTML = '';
    const marks = scaleMarks(key, scale, 0, 15, [0,1,2,3,4,5]);
    const fb = Fretboard({ from: 0, to: 15, marks, fretWidth: 42, onTap: (s2, f2) => AudioEngine.pluck(fretMidi(s2, f2), AudioEngine.now(), { gain: 0.35 }) });
    fbHolder.appendChild(fb);
    const rootFret = (() => { for (let f = 3; f <= 12; f++) if (fretPc(0, f) === pcOf(key)) return f; return 5; })();
    fb.scrollToFret(rootFret + 2);
  }

  function onBar(bar, rootPc, type, np) {
    const fl = flatsFor(key);
    curChord = { rootPc, type };
    chordEl.textContent = AudioEngine.STYLES[style].tonality === 'none' ? '♩' : chordName(rootPc, type, fl);
    const nr = mod12(pcOf(key) + np[0]);
    nextEl.textContent = AudioEngine.STYLES[style].tonality === 'none' ? '' : 'next: ' + chordName(nr, np[1], fl);
    if (cfg.target && AudioEngine.STYLES[style].tonality !== 'none') {
      const iv = CHORD_TYPES[type].iv;
      targetEl.textContent = `🎯 3rd = ${noteName(rootPc + iv[1], fl)} · 5th = ${noteName(rootPc + iv[2], fl)}`;
    } else targetEl.textContent = '';
  }
  function onBeat(b) { [...beatsEl.children].forEach((x, i) => x.classList.toggle('on', i === b)); }

  function startPlay() {
    AudioEngine.startBacking({ style, key, bpm }, { onBar, onBeat });
    playBtn.textContent = '■ Stop backing';
  }
  function stopPlay() {
    AudioEngine.stopBacking();
    playBtn.textContent = '▶ Play backing';
    chordEl.textContent = '–'; nextEl.textContent = ''; targetEl.textContent = '';
    [...beatsEl.children].forEach(x => x.classList.remove('on'));
  }
  function togglePlay() { AudioEngine.ensure(); if (AudioEngine.backingPlaying) stopPlay(); else startPlay(); }
  function restartIfPlaying() { if (AudioEngine.backingPlaying && !AudioEngine.isRecording()) startPlay(); }

  async function toggleRec() {
    AudioEngine.ensure();
    if (AudioEngine.isRecording()) return stopRec();
    try {
      recStatus.textContent = 'Opening input…';
      await AudioEngine.openInput(st.settings.inputId);
      AudioEngine.setInputGain(st.settings.inputGain);
      AudioEngine.setMonitor(st.settings.monitor);
      if (!AudioEngine.backingPlaying && style !== 'metronome') startPlay();
      if (!AudioEngine.backingPlaying && style === 'metronome') startPlay();
      AudioEngine.startRecording({ includeBacking: st.settings.includeBacking, backingLevel: st.settings.backingInRec, syncMs: st.settings.syncMs ?? AudioEngine.estimatedLatencyMs() });
      recBtn.classList.add('on');
      recStatus.innerHTML = '';
      recStatus.append(h('span', { class: 'recdot' }), ' Recording…');
      const tick = () => { recTime.textContent = fmtTime(AudioEngine.elapsed()); meter.firstChild.style.width = Math.min(100, AudioEngine.level() * 110) + '%'; meterRAF = requestAnimationFrame(tick); };
      tick();
    } catch (e) {
      recStatus.textContent = 'Could not open the input: ' + (e && e.message ? e.message : e) + '. Allow microphone access in Settings › Safari (or for the app).';
    }
  }
  async function stopRec() {
    cancelAnimationFrame(meterRAF);
    const res = await AudioEngine.stopRecording();
    stopPlay();
    AudioEngine.closeInput();
    recBtn.classList.remove('on');
    meter.firstChild.style.width = '0%';
    recStatus.textContent = 'Plug in your Pulze Mini, then tap to record.';
    if (!res || !res.blob.size) { UI.toast('Nothing recorded'); return; }

  function saveSheet(res) {

    const titleIn = h('input', { value: defTitle });
    const toneIn = h('input', { value: st.lastTone || '', placeholder: 'e.g. “Plexi crunch”, “Clean + delay”' });
    let fav = false;
    const audio = h('audio', { controls: true, src: URL.createObjectURL(res.blob), style: { width: '100%' } });
    const md = UI.modal(h('div', { class: 'stack' },
      h('h2', null, 'Save this take?'),
      h('p', { class: 'muted small' }, `${fmtTime(res.duration)} · ${AudioEngine.STYLES[style].name} · ${keyLabel()} · ${bpm} BPM`),
      audio,
      h('div', { class: 'tiny' }, 'Title'), titleIn,
      h('div', { class: 'tiny' }, 'Pulze tone / preset used'), toneIn,
      h('div', { class: 'row between' }, h('span', null, '♥ Favourite'), toggleEl(false, v => fav = v)),
      h('div', { class: 'row' },
        h('button', { class: 'btn danger grow', onclick: async () => { if (await UI.confirm('Discard this take?', 'It will be deleted.', 'Discard', true)) { md.close(); opts.onDiscard && opts.onDiscard(); } } }, 'Discard'),
        h('button', { class: 'btn primary grow', onclick: async () => {
          const rec = {
            id: 'r' + Date.now(), blob: res.blob, mime: res.mime, createdAt: Date.now(), duration: res.duration,
            title: titleIn.value.trim() || defTitle, tone: toneIn.value.trim(), fav,
            ctx: { style, key: keyLabel(), bpm, scale, prompt: cfg.prompt || '', source: opts.mode || 'studio', lesson: cfg.lessonId || null },
          };
          try { await RecDB.put(rec); } catch (e) { UI.toast('Could not save: ' + e.message); return; }
          st.lastTone = rec.tone; Store.save();
          md.close();
          UI.toast('Saved to your Journal');
          opts.onSaved && opts.onSaved(rec);
        } }, 'Save'))));
  }

  function styleChips() {
    return h('div', { class: 'chips' }, Object.entries(AudioEngine.STYLES).map(([k, sv]) => {
      const locked = !styleUnlocked(k);
      return h('button', { class: 'chip' + (k === style ? ' on' : '') + (locked ? ' locked' : ''), onclick: () => {
        if (locked) return UI.toast(`Unlocks at ${sv.xp} XP (you have ${Store.state.xp})`);
        if (AudioEngine.isRecording()) return;
        style = k; bpm = sv.bpm; scale = sv.scales[0]; saveLast(); render(); restartIfPlaying();
      } }, (locked ? '🔒 ' : '') + sv.name);
    }));
  }
  function saveLast() { st.lastStudio = { style, key }; Store.save(); }

  function render() {
    root.innerHTML = '';
    const sv = AudioEngine.STYLES[style];
    if (cfg.prompt) root.appendChild(h('div', { class: 'card hero stack' },
      h('div', { class: 'tiny', style: { color: 'var(--accent2)' } }, cfg.challenge ? 'Challenge' : 'Your mission'),
      cfg.challenge ? h('h3', null, cfg.challenge) : null,
      h('p', null, cfg.prompt),
      h('p', { class: 'small muted' }, '🎛 Suggested tone: ' + (cfg.tone || sv.tone))));
    if (!opts.lockStyle) root.appendChild(styleChips());
    const keySel = h('select', { onchange: e => { key = e.target.value; saveLast(); renderFretboard(); restartIfPlaying(); } }, KEYS.map(k => h('option', { value: k, selected: k === key ? true : null }, k)));
    const scaleSel = h('select', { onchange: e => { scale = e.target.value; renderFretboard(); } },
      [...new Set([...sv.scales, 'minorPent', 'majorPent', 'blues', 'major', 'minor', 'dorian', 'mixolydian', 'lydian', 'phrygian'])].map(k => h('option', { value: k, selected: k === scale ? true : null }, SCALES[k].name)));
    const bpmLbl = h('span', { class: 'timer' }, bpm + ' BPM');
    const bpmIn = h('input', { type: 'range', class: 'slider', min: 50, max: 180, value: bpm, oninput: e => { bpm = +e.target.value; bpmLbl.textContent = bpm + ' BPM'; }, onchange: () => restartIfPlaying() });
    root.appendChild(h('div', { class: 'card stack' },
      h('div', { class: 'row' }, h('div', { class: 'grow' }, h('div', { class: 'tiny' }, 'Key'), keySel), h('div', { class: 'grow', style: { flex: 2 } }, h('div', { class: 'tiny' }, 'Scale to use'), scaleSel)),
      h('div', { class: 'row between' }, h('div', { class: 'tiny' }, 'Tempo'), bpmLbl), bpmIn));
    root.appendChild(h('div', { class: 'card stack center' },
      h('div', { class: 'tiny' }, sv.tonality === 'none' ? 'Metronome' : keyLabel()),
      chordEl, nextEl, targetEl, beatsEl,
      h('div', { class: 'row' }, playBtn)));
    root.appendChild(h('div', { class: 'card stack' }, h('div', { class: 'row between' }, h('div', { class: 'tiny' }, SCALES[scale].name + ' · ' + key), h('div', { class: 'small muted' }, 'gold = root')), fbHolder));
    root.appendChild(h('div', { class: 'card stack center' },
      h('div', { class: 'row', style: { justifyContent: 'center' } }, recBtn),
      h('div', { class: 'row' }, recTime, meter),
      recStatus,
      opts.mode === 'session' ? null : h('button', { class: 'btn sm ghost', onclick: () => { cleanupStudio(); App.go('calibrate'); } }, `⏱ Recording sync: ${st.settings.syncMs ?? 'auto'}${st.settings.syncMs != null ? ' ms' : ''} · calibrate`),
      opts.footer || null));
    renderFretboard();
  }
  function cleanupStudio() { cancelAnimationFrame(meterRAF); if (AudioEngine.isRecording()) AudioEngine.stopRecording(); AudioEngine.stopBacking(); AudioEngine.closeInput(); }
  render();
  root.cleanup = () => { cancelAnimationFrame(meterRAF); if (AudioEngine.isRecording()) AudioEngine.stopRecording(); AudioEngine.stopBacking(); AudioEngine.closeInput(); };
  return root;
}

// ---------- Ear training ----------
// Fretboard showing every place a note (or a pair of notes) lives, for the answer reveal
function notePositionsBoard(pcs, rootPc, to = 12) {
  const marks = [];

    const ext = (r.mime || '').includes('mp4') ? 'm4a' : (r.mime || '').includes('ogg') ? 'ogg' : 'webm';
    const name = r.title.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '.' + ext;
    const file = new File([r.blob], name, { type: r.mime || 'audio/mp4' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: r.title }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = h('a', { href: urlFor(r), download: name }); document.body.appendChild(a); a.click(); a.remove();
  }
  renderFilters();
  RecDB.all().then(rs => { recs = rs; renderList(); }).catch(e => { list.innerHTML = ''; list.appendChild(h('p', { class: 'muted' }, 'Could not open storage: ' + e.message)); });
  root.cleanup = () => { player.pause(); Object.values(urlCache).forEach(u => URL.revokeObjectURL(u)); };
  return root;
}

// ---------- Glossary ----------
const GLOSSARY = [
  ['Root', 'The note a chord or scale is built on and named after. In Am, the root is A.'],
  ['Sharp (#)', 'Raises a note by one fret (a half step). F# is one fret above F. Nothing to do with major or minor.'],
  ['Flat (b)', 'Lowers a note by one fret. Bb is one fret below B.'],
  ['Natural (♮)', 'Cancels a sharp or flat.'],
  ['Enharmonic', 'Two names for the same note: F# = Gb, A# = Bb.'],
  ['Half step / semitone', 'The smallest distance: one fret.'],
  ['Whole step / tone', 'Two frets.'],
  ['Octave', 'The same note 12 frets (12 half steps) higher.'],
  ['Interval', 'The distance between two notes, e.g. minor 3rd = 3 frets, perfect 5th = 7 frets.'],
  ['Major chord', '1 – 3 – 5. Written as the letter alone: G = G major.'],
  ['Minor chord (m)', '1 – b3 – 5. Written with an m: Gm. Only the 3rd differs from major.'],
  ['7 (dominant 7)', 'Major chord + minor 7th: G7 = G B D F. Bluesy, wants to resolve.'],
  ['maj7', 'Major chord + major 7th: Gmaj7 = G B D F#. Dreamy. The “maj” is about the 7th.'],
  ['m7', 'Minor chord + minor 7th: Gm7 = G Bb D F. Smooth, funky.'],
  ['5 (power chord)', 'Root + 5th only, no 3rd: G5 = G D. Neither major nor minor.'],

// Listening loop shared by Play-it and the tuner
function Listener(onFrame) {
  let raf = null, last = 0, alive = true;
  async function start() {
    await AudioEngine.openInput(Store.state.settings.inputId);
    AudioEngine.setInputGain(Store.state.settings.inputGain);
    AudioEngine.setMonitor(false);
    const loop = now => {
      if (!alive) return;
      if (now - last > 55) { last = now; onFrame(AudioEngine.detectPitch()); }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }
  function stop() { alive = false; cancelAnimationFrame(raf); AudioEngine.closeInput(); }
  return { start, stop };
}

const PLAYIT_MODES = {
  note:   { title: 'Play the note', icon: '🎯', desc: 'A note name appears. Play it anywhere on the neck.' },
  interval: { title: 'Play the interval', icon: '📏', desc: 'You hear a root. Play the interval asked above it.' },

function PlayItView({ mode = 'note' }) {
  const st = Store.state;
  const root = h('div', { class: 'stack' });
  let listener = null, round = 0, score = 0, target = null, stable = 0, lastPc = null, done = false, pending = false;
  const ROUNDS = mode === 'scale' ? 1 : 10;
  root.appendChild(topBar(PLAYIT_MODES[mode].title, { back: () => { cleanup(); App.go('ear'); } }));

  const liveSub = h('div', { class: 'small muted' }, 'Waiting for sound…');
  const meter = h('div', { class: 'meter' }, h('i'));
  live.append(h('div', { class: 'tiny' }, 'You’re playing'), liveNote, liveSub, meter);
  const btns = h('div', { class: 'row' });
  root.append(head, promptEl, live, btns);

  function setHead() {
    head.innerHTML = '';
    head.append(h('div', { class: 'tiny' }, PLAYIT_MODES[mode].title), h('div', { class: 'badge accent' }, mode === 'scale' ? `${score} / ${target ? target.seq.length : 0} notes` : `Round ${Math.min(round + 1, ROUNDS)}/${ROUNDS} · ${score} ✓`));
  }
  const names = ['root', '3rd', '5th', '7th'];
  function newTarget() {
    stable = 0; lastPc = null; pending = false;
    if (mode === 'note') {
      const pc = randInt(0, 11);

    } else if (mode === 'interval') {
      const iv = pick([3, 4, 5, 7, 10, 12]);
      const r = randInt(45, 55), info = INTERVALS.find(x => x.semi === iv);
      AudioEngine.pluck(r, AudioEngine.now() + 0.05, { gain: 0.4 });
      target = { pcs: [mod12(r + iv)], rootMidi: r, text: h('div', null, h('div', { class: 'tiny' }, `Root: ${noteName(r)} (tap to hear again)`), h('div', { class: 'notehero', style: { fontSize: '40px' } }, `${info.name} above ${noteName(r)}`)), reveal: `${info.name} above ${noteName(r)} = ${noteName(r + iv)}.` };
    } else if (mode === 'chord') {
      const type = pick(['maj', 'min', 'dom7']), rp = randInt(0, 11);
      const iv = CHORD_TYPES[type].iv, idx = randInt(0, iv.length - 1);
      const fl = [3, 8, 10, 5].includes(rp);
      target = { pcs: [mod12(rp + iv[idx])], text: h('div', null, h('div', { class: 'tiny' }, 'Play the'), h('div', { class: 'notehero', style: { fontSize: '44px' } }, `${names[idx]} of ${fullChordName(rp, type).replace(/ \(.*\)/, '')}`)), reveal: `${fullChordName(rp, type).replace(/ \(.*\)/, '')} = ${iv.map(i => noteName(rp + i, fl)).join(' ')}. The ${names[idx]} is ${noteName(rp + iv[idx], fl)}.` };
    }
    renderPrompt();
  }
  function renderPrompt() {
    promptEl.innerHTML = '';
    if (mode === 'scale') {
      const t = target;
      promptEl.append(h('div', { class: 'tiny' }, `${t.key} ${SCALES[t.scale].name} · going up`),
        h('div', { class: 'degrow', style: { justifyContent: 'center' } }, t.seq.map((pc, i) => h('div', { class: 'deg' + (i < score ? ' root' : '') + (i === score ? ' nextdeg' : '') }, h('b', null, t.names[i]), h('small', null, SCALES[t.scale].degrees[i % SCALES[t.scale].degrees.length] || '1')))),
        h('p', { class: 'small muted' }, score < t.seq.length ? `Next note: ${t.names[score]}` : 'Scale complete!'));
      return;
    }
    promptEl.appendChild(target.text);
    if (target.rootMidi) promptEl.onclick = () => AudioEngine.pluck(target.rootMidi, AudioEngine.now(), { gain: 0.4 });
  }
  function onFrame(p) {
    if (done || pending) return;
    meter.firstChild.style.width = Math.min(100, (p ? p.rms : 0) * 900) + '%';
    if (!p || p.silent) { liveSub.textContent = 'Waiting for sound…'; stable = 0; return; }
    if (p.unclear || p.clarity < 0.8) { liveSub.textContent = 'Play one note at a time, let it ring'; return; }
    liveNote.textContent = bothNames(p.pc);
    liveSub.textContent = `${p.cents > 0 ? '+' : ''}${p.cents} cents · ${Math.round(p.freq)} Hz`;
    const want = mode === 'scale' ? [target.seq[score]] : target.pcs;
    if (p.pc === lastPc) stable++; else { stable = 1; lastPc = p.pc; }
    live.classList.toggle('hit', want.includes(p.pc));
    if (stable >= 4 && want.includes(p.pc)) success();
  }
  function success() {
    stable = 0; lastPc = null;
    score++;
    sfx('chime');
    if (mode === 'scale') {
      renderPrompt(); setHead();
      if (score >= target.seq.length) finish();
      pending = true; setTimeout(() => { pending = false; stable = 0; lastPc = null; }, 250);
      return;
    }
    pending = true;
    live.classList.add('flash'); setTimeout(() => live.classList.remove('flash'), 400);
    round++; setHead();
    if (round >= ROUNDS) return finish();
    setTimeout(newTarget, 500);
  }
  function skip() {
    if (done) return;
    if (mode === 'scale') { score++; renderPrompt(); setHead(); if (score >= target.seq.length) finish(); return; }
    UI.toast(target.reveal);
    sfx('nope'); round++; setHead();
    if (round >= ROUNDS) return finish();
    newTarget();
  }
  function finish() {
    done = true;
    listener && listener.stop();
    const total = mode === 'scale' ? target.seq.length : ROUNDS;
    st.playit = st.playit || {}; st.playit[mode] = Math.max(st.playit[mode] || 0, score); st.playit.last = todayStr(); Store.save();
    btns.innerHTML = '';

    live.append(h('div', { style: { fontSize: '48px' } }, score >= total * 0.8 ? '🎸✨' : '🎸'), h('h2', null, `${score} / ${total}`), h('p', { class: 'muted' }, 'The app heard you play. This is how a teacher checks you can really find the notes.'),
      h('div', { class: 'row' }, h('button', { class: 'btn grow', onclick: () => App.go('playit', { mode }) }, 'Again'), h('button', { class: 'btn primary grow', onclick: () => App.go('ear') }, 'Done')));
    if (score) addXP(Math.min(20, score * 2), 'Played it');
    if (score >= total * 0.8) setTimeout(() => confetti(80), 150);
  }
  function cleanup() { done = true; listener && listener.stop(); }

  // intro
  const scalePick = h('div');
  if (mode === 'scale') {
    let key = 'A', scale = 'minorPent';
    const ks = h('select', { onchange: e => key = e.target.value }, KEYS.map(k => h('option', { value: k, selected: k === key ? true : null }, k)));
    const ss = h('select', { onchange: e => scale = e.target.value }, ['minorPent', 'majorPent', 'blues', 'major', 'minor', 'dorian', 'mixolydian'].map(k => h('option', { value: k, selected: k === scale ? true : null }, SCALES[k].name)));
    scalePick.append(h('div', { class: 'row' }, h('div', { class: 'grow' }, h('div', { class: 'tiny' }, 'Key'), ks), h('div', { class: 'grow', style: { flex: 2 } }, h('div', { class: 'tiny' }, 'Scale'), ss)));
    scalePick.getChoice = () => ({ key, scale });
  }
  promptEl.append(h('div', { style: { fontSize: '40px' } }, PLAYIT_MODES[mode].icon), h('p', null, PLAYIT_MODES[mode].desc),
    h('p', { class: 'small muted' }, 'Connect the Pulze Mini (or use the iPhone mic in a quiet room). Play single notes and let them ring.'), scalePick);
  btns.append(h('button', { class: 'btn primary big block', onclick: async () => {
    try {
      AudioEngine.ensure();
      listener = Listener(onFrame);
      await listener.start();
      if (mode === 'scale') {
        const c = scalePick.getChoice(); const rpc = pcOf(c.key);
        const steps = [...SCALES[c.scale].steps, 12];
        const nm = niceName(rpc);
        target = { key: c.key, scale: c.scale, seq: steps.map(s2 => mod12(rpc + s2)), names: steps.map((s2, i) => i === steps.length - 1 ? spell(nm, 0, 0) : spell(nm, s2, degSteps(SCALES[c.scale].degrees[i]))) };
        renderPrompt();
      } else newTarget();
      setHead();
      btns.innerHTML = '';
      btns.append(h('button', { class: 'btn grow', onclick: skip }, mode === 'scale' ? 'Skip note' : 'Skip / show answer'));
    } catch (e) { UI.toast('Could not open the input. Allow microphone access.'); }
  } }, '🎤 Start listening'));
  root.cleanup = cleanup;
  return root;
}

    try { AudioEngine.ensure(); listener = Listener(p => {
      if (!p || p.silent || p.unclear) return;

      noteEl.textContent = noteName(p.pc);
      const c = Math.max(-50, Math.min(50, p.cents));
      needle.style.transform = `rotate(${c * 1.4}deg)`;

      card.classList.toggle('hit', ok);
      info.textContent = ok ? 'In tune ✓' : (p.cents < 0 ? `Too low (${p.cents}¢): tighten` : `Too high (+${p.cents}¢): loosen`);
      [...strings.children].forEach((b, i) => b.classList.toggle('accent', STRINGS[i] === near && p.midi === near.midi));
    }); await listener.start(); startBtn.remove(); } catch (e) { UI.toast('Could not open the input. Allow microphone access.'); }
  } }, '🎤 Start tuner');
  root.appendChild(startBtn);
  root.cleanup = () => listener && listener.stop();
  return root;
}

// ---------- Teacher's note on the Home screen ----------
function teacherNote() {
  const st = Store.state;
  const due = srsDue().length;
  if (due >= 5) return { text: `You have ${due} things to review. 3 minutes now saves relearning later.`, cta: 'Review now', go: () => App.go('review') };
  const unmastered = CHAPTERS.find(c => c.lessons.length && c.lessons.every(l => st.lessonsDone[l.id]) && !st.mastered?.[c.id]);
  if (unmastered) return { text: `You finished “${unmastered.title}”. Take the chapter test to lock it in.`, cta: 'Take the test', go: () => App.go('chaptertest', { id: unmastered.id }) };
  if (st.lastTips && st.lastTips.length) return { text: st.lastTips[0], cta: 'Jam with this in mind', go: () => App.go('studio') };
  for (let lv = 1; lv <= st.ear.unlocked; lv++) {
    const h2 = st.ear.history[lv] || [], acc = earAccuracy(lv);
    if (h2.length >= 10 && acc < 60) return { text: `Your ear finds “${EAR_LEVELS[lv - 1].name}” hard (${acc}%). One short practice round will help.`, cta: 'Practice', go: () => App.go('earRun', { levels: [lv] }) };
  }
  if (!st.playit || !st.playit.last) return { text: 'New: the app can now hear you. Try “Play the note”: it gives you a note and listens to you find it.', cta: 'Try it', go: () => App.go('playit', { mode: 'note' }) };
  const nl = nextLesson();
  if (nl) return { text: `Next on your path: “${nl.title}” (${nl.chapter.title}). Then record a jam and compare it with an old take.`, cta: 'Open lesson', go: () => App.go('lesson', { id: nl.id }) };
  return { text: 'You’ve done every lesson! Keep recording solos and compare them with your first takes.', cta: 'Studio', go: () => App.go('studio') };
}

  root.append(
    h('div', { class: 'card stack' },
      h('h3', null, 'Why your takes can sound late'),
      h('p', { class: 'small muted' }, 'The backing takes a moment to reach your ears, and your guitar takes a moment to come back into the iPhone. In the recording, your playing ends up slightly behind the backing. Measure it once and the app lines them up for you.')),
    h('div', { class: 'card stack' },
      h('h3', null, 'How to measure'),
      h('p', { class: 'small' }, '1. Plug in the Pulze and headphones, exactly like when you record.'),
      h('p', { class: 'small' }, '2. Pick a CLEAN sound on the Pulze (no distortion, delay or reverb) and mute the strings with your fretting hand.'),
      h('p', { class: 'small' }, '3. You’ll hear 4 count-in clicks, then 8 clicks. Strum the muted strings exactly ON each of the 8 clicks.')),
    card,
    h('button', { class: 'btn primary big block', onclick: () => run() }, '⏱ Start measuring'),
    h('div', { class: 'card stack' },
      h('div', { class: 'row between' }, h('span', null, 'Recording sync'), valLbl),
      slider,
      h('p', { class: 'small muted' }, 'Fine-tune by hand: if your guitar still sounds late in the Journal, move it right. If it sounds early, move it left.'),
      h('button', { class: 'btn sm', onclick: () => { st.settings.syncMs = null; Store.save(); valLbl.textContent = `auto (${AudioEngine.estimatedLatencyMs()} ms)`; slider.value = 0; } }, 'Reset to auto')));

  function stop() { active = false; clearInterval(timer); AudioEngine.closeInput(); }

  async function run() {
    if (active) return;
    try {
      AudioEngine.ensure();
      await AudioEngine.openInput(st.settings.inputId);
      AudioEngine.setInputGain(st.settings.inputGain);
      AudioEngine.setMonitor(false);
    } catch (e) { UI.toast('Could not open the input. Allow microphone access.'); return; }
    active = true;
    status.textContent = 'Listening to the room…';
    big.textContent = '…';
    [...beats.children].forEach(x => x.classList.remove('on'));
    // 1) measure the noise floor (RMS)
    const fl = [];
    const t0 = performance.now();
    await new Promise(r => { const iv = setInterval(() => { const b = AudioEngine.inputBuffer(); if (b) { for (let f = 0; f + 128 <= b.data.length; f += 128) { let s2 = 0; for (let i = f; i < f + 128; i++) s2 += b.data[i] * b.data[i]; fl.push(Math.sqrt(s2 / 128)); } } if (performance.now() - t0 > 500) { clearInterval(iv); r(); } }, 20); });
    fl.sort((a, b) => a - b);
    const floor = fl.length ? fl[Math.floor(fl.length * 0.3)] : 0.002; // quiet part of the room/amp noise
    // 2) schedule clicks: 4 count-in + 8 measured, 100 BPM
    const spb = 0.6, start = AudioEngine.now() + 0.4;
    const clicks = [];
    for (let i = 0; i < 12; i++) { const t = start + i * spb; AudioEngine.click(t, i % 4 === 0); if (i >= 4) clicks.push(t); }
    status.textContent = 'Count-in… then strum on every click';
    const hits = [];
    // Onset detection on the energy JUMP, not on a fixed level: works with distortion,
    // reverb or delay on the Pulze, where the sound never really goes quiet between strums.
    const F = 128;
    let lastEnd = 0, slow = floor, lastHit = -1;
    timer = setInterval(() => {
      const b = AudioEngine.inputBuffer(); if (!b) return;
      const N = b.data.length, now = b.end;
      const k = Math.floor((now - clicks[0]) / spb);
      [...beats.children].forEach((x, i) => x.classList.toggle('on', i <= k && k < 8));
      for (let f = 0; f + F <= N; f += F) {
        const fEnd = now - (N - f - F) / b.sr;
        if (fEnd <= lastEnd + 1e-6) continue;
        let s2 = 0, pk = 0;
        for (let i = f; i < f + F; i++) { const v = b.data[i]; s2 += v * v; if (Math.abs(v) > pk) pk = Math.abs(v); }
        const rms = Math.sqrt(s2 / F);
        const fStart = fEnd - F / b.sr;
        if (rms > Math.max(slow * 1.6, floor * 2.5, 0.0015) && fStart - lastHit > 0.25) {
          let idx = f; for (let i = f; i < f + F; i++) if (Math.abs(b.data[i]) > pk * 0.4) { idx = i; break; }
          const onset = now - (N - idx) / b.sr;
          hits.push(onset); lastHit = onset;
          status.textContent = `Strum on every click · heard ${hits.filter(x => x > clicks[0] - 0.15).length}`;
          slow = rms; // the new note becomes the reference so its own sustain doesn't retrigger
        } else {
          slow = slow * 0.9 + rms * 0.1;
        }
        lastEnd = fEnd;
      }
      if (now > clicks[clicks.length - 1] + 0.6) finish(clicks, hits);
    }, 10);
  }
  function finish(clicks, hits) {
    clearInterval(timer); AudioEngine.closeInput(); active = false;
    const lat = [];
    clicks.forEach(c => { const m = hits.filter(x => x > c - 0.1 && x < c + 0.45).sort((a, b) => Math.abs(a - c) - Math.abs(b - c))[0]; if (m !== undefined) lat.push((m - c) * 1000); });
    [...beats.children].forEach(x => x.classList.remove('on'));
    if (lat.length < 5) { big.textContent = '?'; status.textContent = `Only ${lat.length} of 8 strums matched the clicks. Check that the Pulze is selected as the input (Progress › Audio input) and that you strum right on the clicks, then try again.`; sfx('nope'); return; }
    lat.sort((a, b) => a - b);
    const med = Math.max(0, Math.round(lat[Math.floor(lat.length / 2)] / 5) * 5);
    const spread = Math.round(lat[lat.length - 2] - lat[1]);
    st.settings.syncMs = med; Store.save();
    big.textContent = `${med} ms`;
    valLbl.textContent = `${med} ms`; slider.value = med;
    status.textContent = spread > 80 ? `Saved. Your hits were a bit uneven (±${Math.round(spread / 2)} ms), so try once more to be sure.` : 'Saved! Your next recordings will be lined up with the backing.';
    sfx('chime');
  }
  root.cleanup = stop;
  return root;
}

// ---------- App shell & router ----------
const App = {
  current: null, view: null,
  tabs: [['home', 'Home', 'home'], ['learn', 'Learn', 'learn'], ['index', 'Index', 'index'], ['ear', 'Ear', 'ear'], ['studio', 'Studio', 'studio'], ['journal', 'Journal', 'journal']],
  routes: {
    home: { view: HomeView, tab: 'home' },
    session: { view: SessionView, full: true },
    learn: { view: LearnView, tab: 'learn' },
    chapter: { view: ChapterView, tab: 'learn' },
    lesson: { view: LessonView, tab: 'learn' },
    review: { view: ReviewView, tab: 'learn' },
    index: { view: IndexView, tab: 'index' },
    note: { view: NoteView, tab: 'index' },
    ear: { view: EarView, tab: 'ear' },
    playit: { view: PlayItView, tab: 'ear' },
    tuner: { view: TunerView, tab: 'ear' },
    calibrate: { view: CalibrateView, tab: 'studio' },
    chaptertest: { view: ChapterTestView, tab: 'learn' },
    earRun: { view: EarRunView, tab: 'ear' },
    studio: { view: StudioScreen, tab: 'studio' },
    challenge: { view: ChallengeView, tab: 'home' },
    journal: { view: JournalView, tab: 'journal' },
    progress: { view: ProgressView, tab: 'home' },
  },
  go(name, params = {}) {
    if (this.view && this.view.cleanup) { try { this.view.cleanup(); } catch (e) {} }
    const r = this.routes[name] || this.routes.home;
    this.current = name;
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.classList.toggle('fullscreen', !!r.full);
    try { this.view = r.view(params); }
    catch (e) { console.error(e); this.view = h('div', { class: 'card' }, h('h3', null, 'Something went wrong'), h('p', { class: 'small muted' }, String(e && e.stack || e))); }
    this.view.classList.add('view-enter');
    app.appendChild(this.view);
    this.renderTabs(r);
    window.scrollTo(0, 0);
  },
  renderTabs(r) {
    let bar = document.querySelector('.tabs');
    if (r.full) { if (bar) bar.style.display = 'none'; return; }
    if (!bar) {
      bar = h('nav', { class: 'tabs' }, h('i', { class: 'tabpill', style: { width: (100 / this.tabs.length) + '%' } }));
      this.tabs.forEach(([k, label, ic]) => bar.appendChild(h('button', { 'data-tab': k, onclick: () => { if (this.current !== k) this.go(k); } }, icon(ic, 24), h('span', null, label))));
      document.body.appendChild(bar);
    }
    bar.style.display = '';
    const idx = this.tabs.findIndex(t => t[0] === r.tab);
    bar.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === idx));
    bar.querySelector('.tabpill').style.transform = `translateX(${idx * 100}%)`;
  },
};

// ---------- touch feel: bubble ripple + soft pop ----------
const PRESSABLE = '.notebubble, .keychip, .progrow, .friendrow, .btn, .chip, .tile, .option, .card.tap, .tabs button, .iconbtn, .levelchip, .seg button, .lessonrow, .recbtn, .chordbox, .rec .play';
document.addEventListener('pointerdown', e => {
  const el = e.target.closest(PRESSABLE);
  if (!el || el.disabled) return;
  const r = el.getBoundingClientRect();
  const size = Math.max(r.width, r.height) * 2.2;
  const rip = document.createElement('span');
  rip.className = 'rip';
  rip.style.width = rip.style.height = size + 'px';
  rip.style.left = (e.clientX - r.left - size / 2) + 'px';
  rip.style.top = (e.clientY - r.top - size / 2) + 'px';
  el.appendChild(rip);
  setTimeout(() => rip.remove(), 650);
  if (Store.state && Store.state.settings.uiSounds !== false) AudioEngine.pop(el.classList.contains('primary') || el.classList.contains('on'));
}, { passive: true });

window.addEventListener('DOMContentLoaded', () => {
  Store.load();
  requestPersistence();
  App.go('home');
  try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
});

</script>
